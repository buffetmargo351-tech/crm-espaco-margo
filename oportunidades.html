<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Espaço Margô - Oportunidades</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f4f0ef;
      color: #2f2423;
      min-height: 100vh;
    }

    .phone-frame {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }

    .app {
      padding: 22px 18px 28px;
      min-height: 100vh;
    }

    .top {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      margin-bottom: 16px;
    }

    .back {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      border: 1px solid #eadada;
      background: #ffffff;
      color: #d85f6f;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
    }

    .headline {
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      color: #2f2423;
      line-height: 1.2;
    }

    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .card-resumo {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 14px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      box-shadow: 0 7px 16px rgba(0,0,0,0.05);
      cursor: pointer;
      padding: 6px 4px;
    }

    .card-resumo.active {
      background: #f8e9ea;
      border-color: #d85f6f;
      box-shadow: 0 8px 18px rgba(216,95,111,0.14);
    }

    .numero {
      font-size: 20px;
      font-weight: 950;
      color: #dc6572;
      line-height: 1;
      margin-bottom: 4px;
    }

    .texto {
      font-size: 9px;
      font-weight: 900;
      color: #cf6973;
      line-height: 1;
      text-transform: uppercase;
    }

    .card-resumo.resgatar .numero,
    .card-resumo.resgatar .texto {
      color: #c98923;
    }

    .card-resumo.resgatar.active {
      background: #fff3d9;
      border-color: #e0ae56;
    }

    .card-resumo.encerrados .numero,
    .card-resumo.encerrados .texto {
      color: #4f8f5a;
    }

    .card-resumo.encerrados.active {
      background: #eef7e9;
      border-color: #b9ddb5;
    }

    .card-resumo.atencao .numero,
    .card-resumo.atencao .texto {
      color: #b66a31;
    }

    .card-resumo.atencao.active {
      background: #fff3e8;
      border-color: #e3b489;
    }

    .card-resumo.empresas .numero,
    .card-resumo.empresas .texto {
      color: #4e7772;
    }

    .card-resumo.empresas.active {
      background: #edf7f5;
      border-color: #9ec9c2;
    }

    .section-title {
      font-size: 13px;
      font-weight: 900;
      color: #e15f70;
      margin-bottom: 9px;
    }

    .card-casal {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 7px 16px rgba(0,0,0,0.045);
      cursor: pointer;
    }

    .casal-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }

    .avatar {
      width: 39px;
      height: 39px;
      border-radius: 14px;
      background: #f8e9ea;
      color: #d85f6f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 950;
      flex-shrink: 0;
    }

    .info-principal {
      flex: 1;
      min-width: 0;
    }

    .nome {
      font-size: 15px;
      font-weight: 950;
      color: #2f2423;
      margin-bottom: 2px;
    }

    .telefone-card {
      font-size: 12px;
      color: #6f5552;
      font-weight: 850;
      line-height: 1.2;
      margin-bottom: 2px;
      letter-spacing: 0.1px;
    }

    .status {
      font-size: 11px;
      color: #9a6b70;
      font-weight: 800;
    }

    .seta {
      color: #b98286;
      font-size: 23px;
      font-weight: 300;
    }

    .linha-info {
      font-size: 12px;
      color: #7d6461;
      font-weight: 800;
      line-height: 1.2;
      margin-left: 49px;
      margin-bottom: 3px;
    }

    .sonhos {
      font-size: 11px;
      color: #a35d61;
      font-weight: 900;
      line-height: 1.25;
      margin-left: 49px;
      margin-top: 2px;
    }

    .alerta {
      margin-left: 49px;
      margin-top: 5px;
      color: #a66d16;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.25;
    }

    .empty {
      display: none;
      text-align: center;
      margin-top: 50px;
      color: #9a6b70;
      font-weight: 800;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (min-width: 700px) {
      body {
        padding: 20px 0;
      }

      .phone-frame {
        min-height: calc(100vh - 40px);
        border-radius: 34px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      }
    }
  </style>
</head>

<body>
  <div class="phone-frame">
    <main class="app">
      <header class="top">
        <button class="back" onclick="voltarHome()">‹</button>
        <div class="headline">Onde ainda existe dinheiro na mesa</div>
        <div></div>
      </header>

      <section class="cards-resumo">
        <div class="card-resumo active" id="card-agendar" onclick="trocarAba('agendar')">
          <div class="numero" id="totalAgendar">0</div>
          <div class="texto">Agendar</div>
        </div>

        <div class="card-resumo empresas" id="card-empresas" onclick="trocarAba('empresas')">
          <div class="numero" id="totalEmpresas">0</div>
          <div class="texto">Empresas</div>
        </div>

        <div class="card-resumo resgatar" id="card-resgatar" onclick="trocarAba('resgatar')">
          <div class="numero" id="totalResgatar">0</div>
          <div class="texto">Resgatar</div>
        </div>

        <div class="card-resumo atencao" id="card-atencao" onclick="trocarAba('atencao')">
          <div class="numero" id="totalAtencao">0</div>
          <div class="texto">Atenção</div>
        </div>

        <div class="card-resumo agendados" id="card-encerrados" onclick="trocarAba('encerrados')">
          <div class="numero" id="totalEncerrados">0</div>
          <div class="texto">Encerrados</div>
        </div>
      </section>

      <section>
        <div class="section-title" id="tituloLista">Casais para agendar consultoria</div>

        <div id="listaCasais"></div>

        <div class="empty" id="emptyState">
          Nenhum casal nesta etapa.<br>
          Ótimo sinal. ✨
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_OPORTUNIDADES = "https://n8n.espacomargo.com.br/webhook/crm/oportunidades";
    const API_CASAIS = "https://n8n.espacomargo.com.br/webhook/crm/casais";
    const API_ENCERRADOS = "https://n8n.espacomargo.com.br/webhook/crm/encerrados";
    const API_STATUS_OPORTUNIDADE = "https://n8n.espacomargo.com.br/webhook/crm/status-oportunidade";
    const API_RESUMO_PROPOSTAS = "https://n8n.espacomargo.com.br/webhook/crm/resumo-propostas";

    let dados = {
      agendar: [],
      resgatar: [],
      agendados: [],
      empresas: [],
      atencao: [],
      encerrados: [],
      totais: {
        agendar: 0,
        resgatar: 0,
        agendados: 0,
        empresas: 0,
        atencao: 0,
        encerrados: 0
      }
    };

    let abaAtual = pegarAbaInicial();
    let usuarioAtualId = pegarUsuarioIdDaUrl();

    const titulos = {
      agendar: "Casais para agendar consultoria",
      resgatar: "Casais para resgatar",
      agendados: "Visitas agendadas",
      empresas: "Empresas para atendimento",
      atencao: "Atendimentos assumidos por você",
      encerrados: "Oportunidades encerradas"
    };

    function pegarAbaInicial() {
      const params = new URLSearchParams(window.location.search);
      const aba = params.get("aba");

      if (aba === "resgatar" || aba === "encerrados" || aba === "agendados" || aba === "empresas" || aba === "atencao" || aba === "agendar") {
        return aba;
      }

      return "agendar";
    }

    function pegarUsuarioIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("usuario_id") || "";
    }

    function montarQueryUsuario() {
      if (!usuarioAtualId) return "";
      return "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function voltarHome() {
      const query = montarQueryUsuario();
      window.location.href = query ? "menu.html?" + query : "menu.html";
    }

    function pertenceAoUsuario(casal) {
      if (!usuarioAtualId) return true;
      return String(casal.consultora_responsavel || "").trim() === String(usuarioAtualId).trim();
    }

    function urlComUsuario(baseUrl) {
      if (!usuarioAtualId) return baseUrl;

      const separador = baseUrl.includes("?") ? "&" : "?";
      return baseUrl + separador + "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function normalizarStatus(status) {
      return String(status || "").trim().toUpperCase();
    }

    function primeiraRespostaJaEnviada(casal) {
      const primeiraIA = String(casal && casal.ia_primeira_resposta_enviada || "").trim().toUpperCase() === "SIM";
      const statusMilene = String(casal && casal.ultimo_status_milene || "").trim().toUpperCase();
      const temDataResposta = Boolean(String(casal && casal.data_ultima_resposta_ia || "").trim());
      return primeiraIA || statusMilene === "RESPONDIDO" || temDataResposta;
    }

    function modoAtendimentoHumano(casal) {
      return String(casal && casal.modo_atendimento_ia || "").trim().toUpperCase() === "HUMANO";
    }

    function ehCorporativo(casal) {
      const tipo = String(casal && casal.tipo_evento || "").trim().toUpperCase();
      const origem = String(casal && casal.origem || "").trim().toUpperCase();
      return tipo === "CORPORATIVO" || origem === "META_CORPORATIVO";
    }

    function temVisitaAgendada(casal) {
      const status = normalizarStatus(casal && casal.status_casal);
      return status === "CONSULTORIA_AGENDADA" || Boolean(String(casal && casal.agenda_id || "").trim());
    }

    function extrairListaCasais(dadosCasais) {
      if (Array.isArray(dadosCasais)) return dadosCasais;
      if (dadosCasais && Array.isArray(dadosCasais.casais)) return dadosCasais.casais;
      if (dadosCasais && Array.isArray(dadosCasais.data)) return dadosCasais.data;
      if (dadosCasais && Array.isArray(dadosCasais.items)) return dadosCasais.items;
      if (dadosCasais && dadosCasais.casal_id) return [dadosCasais];
      return [];
    }

    function organizarDadosPorStatus(retorno, casaisNovosApi = []) {
      const todos = [
        ...(Array.isArray(casaisNovosApi) ? casaisNovosApi.filter(ehCorporativo) : []),
        ...(retorno.agendar || []),
        ...(retorno.resgatar || []),
        ...(retorno.agendados || []),
        ...(retorno.empresas || []),
        ...(retorno.atencao || []),
        ...(retorno.encerrados || [])
      ];

      const mapa = new Map();
      todos.forEach(casal => {
        if (casal && casal.casal_id) mapa.set(casal.casal_id, casal);
      });

      const todosUnicos = Array.from(mapa.values());
      const unicos = todosUnicos.filter(pertenceAoUsuario);

      const agendados = unicos
        .filter(temVisitaAgendada)
        .sort((a, b) => chaveVisita(a).localeCompare(chaveVisita(b)));

      const encerrados = unicos.filter(casal => normalizarStatus(casal.status_casal) === "PERDIDO");

      // EMPRESAS e uma fila compartilhada entre usuarios autenticados.
      // A responsabilidade continua registrada em consultora_responsavel, mas nao limita a visualizacao.
      const empresas = todosUnicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal)) return false;
        if (status === "PERDIDO" || status === "GANHO") return false;
        return ehCorporativo(casal);
      });

      const atencao = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal)) return false;
        if (ehCorporativo(casal)) return false;
        if (status === "PERDIDO" || status === "GANHO") return false;
        return modoAtendimentoHumano(casal);
      });

      const agendar = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal) || ehCorporativo(casal) || modoAtendimentoHumano(casal)) return false;
        return status === "EM_ATENDIMENTO" ||
          (status === "NOVO" && primeiraRespostaJaEnviada(casal));
      });

      const resgatar = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal) || ehCorporativo(casal) || modoAtendimentoHumano(casal)) return false;
        return status === "VISITOU_NAO_FECHOU";
      });

      return {
        agendar,
        resgatar,
        agendados,
        empresas,
        atencao,
        encerrados,
        totais: {
          agendar: agendar.length,
          resgatar: resgatar.length,
          agendados: agendados.length,
          empresas: empresas.length,
          atencao: atencao.length,
          encerrados: encerrados.length
        }
      };
    }

    function chaveVisita(casal) {
      const data = String(casal.data_consultoria || "").trim();
      const hora = String(casal.hora_consultoria || "00:00").trim();
      const p = data.split("/");
      if (p.length !== 3) return "9999-99-99T99:99";
      return `${p[2]}-${String(p[1]).padStart(2,"0")}-${String(p[0]).padStart(2,"0")}T${hora}`;
    }

    async function carregarResumosPropostas() {
      try {
        const r = await fetch(API_RESUMO_PROPOSTAS + "?t=" + Date.now());
        const j = await r.json();
        const lista = Array.isArray(j) ? j : (j.resumos || []);
        const mapa = new Map(lista.map(x => [String(x.casal_id || ""), x]));

        ["agendar", "resgatar", "agendados", "empresas", "atencao", "encerrados"].forEach(grupo => {
          (dados[grupo] || []).forEach(casal => {
            const resumo = mapa.get(String(casal.casal_id || ""));
            if (resumo) {
              casal.proposta_resumo_data = resumo.data_proposta || "";
              casal.proposta_resumo_valor = resumo.valor_referencia || "";
              casal.proposta_resumo_tipo = resumo.valor_tipo || "";
            }
          });
        });
      } catch (e) {
        console.warn("Resumo de propostas indisponível:", e);
      }
    }

    function primeiraLetra(nome) {
      if (!nome) return "?";
      return nome.trim().charAt(0).toUpperCase();
    }

    function nomeCasal(casal) {
      const pessoa1 = casal.nome_pessoa_1 || casal.nome_noiva || "";
      const pessoa2 = casal.nome_pessoa_2 || casal.nome_noivo || "";
      const contato = casal.nome_contato || "";

      if (pessoa1 && pessoa2) {
        return pessoa1 + " ❤️ " + pessoa2;
      }

      return pessoa1 || pessoa2 || contato || "Casal sem nome";
    }

    function formatarTelefoneCard(valor) {
      let telefone = String(valor || "").replace(/\D/g, "");

      if ((telefone.length === 12 || telefone.length === 13) && telefone.startsWith("55")) {
        telefone = telefone.slice(2);
      }

      if (telefone.length === 11) {
        return "(" + telefone.slice(0, 2) + ") " + telefone.slice(2, 7) + "-" + telefone.slice(7);
      }

      if (telefone.length === 10) {
        return "(" + telefone.slice(0, 2) + ") " + telefone.slice(2, 6) + "-" + telefone.slice(6);
      }

      return telefone || "Telefone não informado";
    }

    function labelEncantamento(valor) {
      const mapa = {
        por_do_sol: "Pôr do sol",
        lago: "Lago",
        jardim: "Jardim",
        cerimonia_externa: "Cerimônia externa",
        gastronomia: "Gastronomia",
        atendimento: "Atendimento",
        estrutura: "Estrutura",
        exclusividade: "Exclusividade",
        familiar: "Familiar",
        familia: "Família",
        natureza: "Natureza",
        festa_animada: "Festa animada",
        intimista: "Intimista",
        emocionante: "Emocionante"
      };

      return mapa[valor] || String(valor).replaceAll("_", " ");
    }

    function formatarEncantamentos(texto) {
      if (!texto) return "Não informado";

      return String(texto)
        .split("|")
        .map(item => item.trim())
        .filter(Boolean)
        .map(labelEncantamento)
        .join(" • ");
    }

    function formatarContato(casal) {
      if (!casal.ultimo_contato) return "Último contato não informado";
      return "Último contato: " + casal.ultimo_contato;
    }

    function trocarAba(tipo) {
      abaAtual = tipo;

      document.querySelectorAll(".card-resumo").forEach(card => {
        card.classList.remove("active");
      });

      const cardAtivo = document.getElementById("card-" + tipo);
      if (cardAtivo) cardAtivo.classList.add("active");
      document.getElementById("tituloLista").textContent = titulos[tipo] || titulos.agendar;

      renderizarLista(tipo);
    }

    function formatarMoeda(valor) {
      const n = Number(String(valor || "").replace(/\./g, "").replace(",", ".").replace(/[^\d.-]/g, ""));
      return Number.isFinite(n) && n > 0 ? n.toLocaleString("pt-BR", { style:"currency", currency:"BRL" }) : "";
    }
    function dataCurta(valor) {
      if (!valor) return "";
      const d = new Date(valor);
      return !Number.isNaN(d.getTime()) ? d.toLocaleDateString("pt-BR") : String(valor);
    }
    function linhaProposta(casal) {
      const data = casal.proposta_resumo_data || casal.proposta_ativa_data || casal.data_ultima_proposta || casal.proposta_data_envio || "";
      const valor = casal.proposta_resumo_valor || casal.proposta_ativa_valor || casal.valor_proposta || casal.proposta_valor || casal.valor_total_proposta || "";
      const tipoValor = String(casal.proposta_resumo_tipo || "").toUpperCase();

      if (!data && !valor && !casal.proposta_ativa_id && !casal.proposta_ativa_url) {
        return "📄 Proposta: não enviada";
      }

      const p = [];
      if (data) p.push("enviada em " + dataCurta(data));
      if (valor) {
        const moeda = formatarMoeda(valor) || String(valor);
        p.push(tipoValor === "ESCOLHIDO" ? moeda : "a partir de " + moeda);
      }
      return "📄 Proposta: " + (p.length ? p.join(" • ") : "enviada");
    }
    async function reabrirOportunidade(casalId,event) {
      if(event)event.stopPropagation();
      if(!confirm("Reabrir esta oportunidade e devolvê-la ao atendimento ativo?"))return;
      const r=await fetch(API_STATUS_OPORTUNIDADE,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({casal_id:casalId,acao:"REABRIR",usuario_id:usuarioAtualId||"APP"})});
      const j=await r.json(); if(!r.ok||!j.sucesso)throw new Error(j.erro||"Falha ao reabrir");
      await carregarOportunidades();
    }

    function renderizarLista(tipo) {
      const lista = document.getElementById("listaCasais");
      const empty = document.getElementById("emptyState");

      lista.innerHTML = "";

      if (!dados[tipo] || dados[tipo].length === 0) {
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      dados[tipo].forEach(casal => {
        const card = document.createElement("div");
        card.className = "card-casal";

        card.onclick = () => window.location.href = urlComUsuario("atendimento.html?casal_id=" + encodeURIComponent(casal.casal_id) + "&fila=" + encodeURIComponent(tipo));

        const corporativo = tipo === "empresas" || ehCorporativo(casal);
        const nome = corporativo
          ? (casal.nome_empresa || casal.nome_contato || "Empresa sem nome")
          : nomeCasal(casal);
        const sonhos = corporativo ? "" : formatarEncantamentos(casal.encantamentos_principais);

        let statusTexto = "Oportunidade";
        let alerta = "";
        let infoExtra = "";

        if (tipo === "agendar") {
          statusTexto =
            (normalizarStatus(casal.status_casal) === "NOVO" && !primeiraRespostaJaEnviada(casal))
              ? "Novo casal"
              : "Em atendimento";
          alerta = "";
        }

        if (tipo === "resgatar") {
          statusTexto = "Visitou e não fechou";
          alerta = "Atenção: retomar contato e tentar resgatar.";
        }

        if (tipo === "agendados") {
          statusTexto = "Visita agendada";
          alerta = "";
          const visita = [casal.data_consultoria || "", casal.hora_consultoria ? "às " + casal.hora_consultoria : ""]
            .filter(Boolean).join(" ");
          infoExtra = `<div class="linha-info">🗓 Visita: ${visita || "Horário não informado"}</div>`;
        }

        if (tipo === "empresas") {
          statusTexto = "Evento corporativo";
          alerta = "Atendimento humano. Lead corporativo fora da fila de casamentos.";
        }

        if (tipo === "atencao") {
          statusTexto = "Atendimento humano";
          alerta = "A Milene está pausada. Este atendimento está sob sua responsabilidade.";
        }

        if (tipo === "encerrados") {
          statusTexto = "Oportunidade encerrada"; alerta = "";
          infoExtra = `<div class="linha-info">⛔ Motivo: ${casal.motivo_perda || "Não informado"}</div>
          <button type="button" onclick="reabrirOportunidade('${casal.casal_id}', event)" style="margin-top:8px;border:1px solid #d9b9b9;background:#fff;border-radius:10px;padding:7px 10px;font-weight:800;cursor:pointer;">REABRIR OPORTUNIDADE</button>`;
        }

        const linhaEvento = corporativo
          ? `<div class="linha-info">📅 ${casal.data_evento || "Data não informada"} &nbsp; | &nbsp; 👥 ${casal.quantidade_pessoas || "--"} pessoas</div>`
          : `<div class="linha-info">📅 ${casal.data_casamento || "Data não informada"} &nbsp; | &nbsp; 👥 ${casal.quantidade_convidados || "--"} convidados</div>`;
        const contatoEmpresa = corporativo && casal.nome_contato
          ? `<div class="linha-info">👤 Contato: ${casal.nome_contato}</div>`
          : "";
        const sonhosHtml = corporativo ? "" : `<div class="sonhos">✨ Sonhos: ${sonhos}</div>`;

        card.innerHTML = `
          <div class="casal-top">
            <div class="avatar">${primeiraLetra(nome)}</div>

            <div class="info-principal">
              <div class="nome">${nome}</div>
              <div class="telefone-card">📱 ${formatarTelefoneCard(casal.telefone || casal.telefone_noiva || casal.whatsapp)}</div>
              <div class="status">${statusTexto}</div>
            </div>

            <div class="seta">›</div>
          </div>

          ${linhaEvento}
          ${contatoEmpresa}
          <div class="linha-info">⏱ ${formatarContato(casal)}</div>

          ${sonhosHtml}
          <div class="linha-info">${linhaProposta(casal)}</div>
          ${infoExtra}
          ${alerta ? `<div class="alerta">⚠️ ${alerta}</div>` : ""}
        `;

        lista.appendChild(card);
      });
    }

    async function carregarOportunidades() {
      try {
        const resposta = await fetch(API_OPORTUNIDADES + "?t=" + Date.now());
        const retorno = await resposta.json();

        let casaisNovosApi = [];
        try {
          const rc = await fetch(API_CASAIS + "?t=" + Date.now(), { cache: "no-store" });
          const jc = await rc.json();
          casaisNovosApi = extrairListaCasais(jc);
        } catch (e) {
          console.warn("Não foi possível carregar NOVOS para compor EMPRESAS:", e);
        }

        try {
          const re=await fetch(API_ENCERRADOS+"?t="+Date.now()); const je=await re.json();
          retorno.encerrados=Array.isArray(je)?je:(je.encerrados||je.casais||[]);
        } catch(e) { retorno.encerrados=[]; console.warn("Não foi possível carregar encerrados:",e); }
        dados = organizarDadosPorStatus(retorno, casaisNovosApi);
        await carregarResumosPropostas();

        document.getElementById("totalAgendar").textContent = dados.totais.agendar;
        document.getElementById("totalResgatar").textContent = dados.totais.resgatar;
        document.getElementById("totalEmpresas").textContent = dados.totais.empresas;
        document.getElementById("totalAtencao").textContent = dados.totais.atencao;
        document.getElementById("totalEncerrados").textContent = dados.totais.encerrados;

        trocarAba(abaAtual);

      } catch (erro) {
        console.error("Erro ao carregar oportunidades:", erro);

        document.getElementById("listaCasais").innerHTML =
          '<div class="empty" style="display:block;">Erro ao carregar oportunidades.</div>';
      }
    }

    carregarOportunidades();

    if (abaAtual === "encerrados") {
      setTimeout(carregarOportunidades, 900);
      setTimeout(carregarOportunidades, 1800);
    }
  </script>
</body>
</html>
