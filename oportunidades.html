<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Espaço Margô - Oportunidades</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f4f0ef;
      color: #2f2423;
      min-height: 100vh;
    }

    .phone-frame {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }

    .app {
      padding: 22px 18px 28px;
      min-height: 100vh;
    }

    .top {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      margin-bottom: 16px;
    }

    .back {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      border: 1px solid #eadada;
      background: #ffffff;
      color: #d85f6f;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
    }

    .headline {
      text-align: center;
      font-size: 16px;
      font-weight: 900;
      color: #2f2423;
      line-height: 1.2;
    }

    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .card-resumo {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 14px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      box-shadow: 0 7px 16px rgba(0,0,0,0.05);
      cursor: pointer;
      padding: 6px 4px;
    }

    .card-resumo.active {
      background: #f8e9ea;
      border-color: #d85f6f;
      box-shadow: 0 8px 18px rgba(216,95,111,0.14);
    }

    .numero {
      font-size: 20px;
      font-weight: 950;
      color: #dc6572;
      line-height: 1;
      margin-bottom: 4px;
    }

    .texto {
      font-size: 9px;
      font-weight: 900;
      color: #cf6973;
      line-height: 1;
      text-transform: uppercase;
    }

    .card-resumo.resgatar .numero,
    .card-resumo.resgatar .texto {
      color: #c98923;
    }

    .card-resumo.resgatar.active {
      background: #fff3d9;
      border-color: #e0ae56;
    }

    .card-resumo.agendados .numero,
    .card-resumo.agendados .texto {
      color: #4f8f5a;
    }

    .card-resumo.agendados.active {
      background: #eef7e9;
      border-color: #b9ddb5;
    }

    .section-title {
      font-size: 13px;
      font-weight: 900;
      color: #e15f70;
      margin-bottom: 9px;
    }

    .card-casal {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 7px 16px rgba(0,0,0,0.045);
      cursor: pointer;
    }

    .casal-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 5px;
    }

    .avatar {
      width: 39px;
      height: 39px;
      border-radius: 14px;
      background: #f8e9ea;
      color: #d85f6f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 950;
      flex-shrink: 0;
    }

    .info-principal {
      flex: 1;
      min-width: 0;
    }

    .nome {
      font-size: 15px;
      font-weight: 950;
      color: #2f2423;
      margin-bottom: 2px;
    }

    .telefone-card {
      font-size: 12px;
      color: #6f5552;
      font-weight: 850;
      line-height: 1.2;
      margin-bottom: 2px;
      letter-spacing: 0.1px;
    }

    .status {
      font-size: 11px;
      color: #9a6b70;
      font-weight: 800;
    }

    .seta {
      color: #b98286;
      font-size: 23px;
      font-weight: 300;
    }

    .linha-info {
      font-size: 12px;
      color: #7d6461;
      font-weight: 800;
      line-height: 1.2;
      margin-left: 49px;
      margin-bottom: 3px;
    }

    .sonhos {
      font-size: 11px;
      color: #a35d61;
      font-weight: 900;
      line-height: 1.25;
      margin-left: 49px;
      margin-top: 2px;
    }

    .alerta {
      margin-left: 49px;
      margin-top: 5px;
      color: #a66d16;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.25;
    }

    .empty {
      display: none;
      text-align: center;
      margin-top: 50px;
      color: #9a6b70;
      font-weight: 800;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (min-width: 700px) {
      body {
        padding: 20px 0;
      }

      .phone-frame {
        min-height: calc(100vh - 40px);
        border-radius: 34px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      }
    }
  </style>
</head>

<body>
  <div class="phone-frame">
    <main class="app">
      <header class="top">
        <button class="back" onclick="voltarHome()">‹</button>
        <div class="headline">Onde ainda existe dinheiro na mesa</div>
        <div></div>
      </header>

      <section class="cards-resumo">
        <div class="card-resumo active" id="card-agendar" onclick="trocarAba('agendar')">
          <div class="numero" id="totalAgendar">0</div>
          <div class="texto">Agendar</div>
        </div>

        <div class="card-resumo resgatar" id="card-resgatar" onclick="trocarAba('resgatar')">
          <div class="numero" id="totalResgatar">0</div>
          <div class="texto">Resgatar</div>
        </div>

        <div class="card-resumo agendados" id="card-agendados" onclick="trocarAba('agendados')">
          <div class="numero" id="totalAgendados">0</div>
          <div class="texto">Agendados</div>
        </div>
      </section>

      <section>
        <div class="section-title" id="tituloLista">Casais para agendar consultoria</div>

        <div id="listaCasais"></div>

        <div class="empty" id="emptyState">
          Nenhum casal nesta etapa.<br>
          Ótimo sinal. ✨
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_OPORTUNIDADES = "https://n8n.espacomargo.com.br/webhook/crm/oportunidades";

    let dados = {
      agendar: [],
      resgatar: [],
      agendados: [],
      totais: {
        agendar: 0,
        resgatar: 0,
        agendados: 0
      }
    };

    let abaAtual = pegarAbaInicial();
    let usuarioAtualId = pegarUsuarioIdDaUrl();

    const titulos = {
      agendar: "Casais para agendar consultoria",
      resgatar: "Casais para resgatar",
      agendados: "Consultorias agendadas"
    };

    function pegarAbaInicial() {
      const params = new URLSearchParams(window.location.search);
      const aba = params.get("aba");

      if (aba === "resgatar" || aba === "agendados" || aba === "agendar") {
        return aba;
      }

      return "agendar";
    }

    function pegarUsuarioIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("usuario_id") || "";
    }

    function montarQueryUsuario() {
      if (!usuarioAtualId) return "";
      return "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function voltarHome() {
      const query = montarQueryUsuario();
      window.location.href = query ? "menu.html?" + query : "menu.html";
    }

    function pertenceAoUsuario(casal) {
      if (!usuarioAtualId) return true;
      return String(casal.consultora_responsavel || "").trim() === String(usuarioAtualId).trim();
    }

    function urlComUsuario(baseUrl) {
      if (!usuarioAtualId) return baseUrl;

      const separador = baseUrl.includes("?") ? "&" : "?";
      return baseUrl + separador + "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function normalizarStatus(status) {
      return String(status || "").trim().toUpperCase();
    }

    function primeiraRespostaJaEnviada(casal) {
      return String(casal && casal.ia_primeira_resposta_enviada || "").trim().toUpperCase() === "SIM";
    }

    function organizarDadosPorStatus(retorno) {
      const todos = [
        ...(retorno.agendar || []),
        ...(retorno.resgatar || []),
        ...(retorno.agendados || [])
      ];

      const mapa = new Map();

      todos.forEach(casal => {
        if (casal && casal.casal_id) {
          mapa.set(casal.casal_id, casal);
        }
      });

      const unicos = Array.from(mapa.values()).filter(pertenceAoUsuario);

      const agendar = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return status === "EM_ATENDIMENTO" ||
          (status === "NOVO" && primeiraRespostaJaEnviada(casal));
      });

      const resgatar = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return status === "VISITOU_NAO_FECHOU";
      });

      const agendados = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return status === "CONSULTORIA_AGENDADA";
      });

      return {
        agendar,
        resgatar,
        agendados,
        totais: {
          agendar: agendar.length,
          resgatar: resgatar.length,
          agendados: agendados.length
        }
      };
    }

    function primeiraLetra(nome) {
      if (!nome) return "?";
      return nome.trim().charAt(0).toUpperCase();
    }

    function nomeCasal(casal) {
      const noiva = casal.nome_noiva || "";
      const noivo = casal.nome_noivo || "";

      if (noiva && noivo) {
        return noiva + " ❤️ " + noivo;
      }

      return noiva || noivo || "Casal sem nome";
    }

    function formatarTelefoneCard(valor) {
      let telefone = String(valor || "").replace(/\D/g, "");

      if ((telefone.length === 12 || telefone.length === 13) && telefone.startsWith("55")) {
        telefone = telefone.slice(2);
      }

      if (telefone.length === 11) {
        return "(" + telefone.slice(0, 2) + ") " + telefone.slice(2, 7) + "-" + telefone.slice(7);
      }

      if (telefone.length === 10) {
        return "(" + telefone.slice(0, 2) + ") " + telefone.slice(2, 6) + "-" + telefone.slice(6);
      }

      return telefone || "Telefone não informado";
    }

    function labelEncantamento(valor) {
      const mapa = {
        por_do_sol: "Pôr do sol",
        lago: "Lago",
        jardim: "Jardim",
        cerimonia_externa: "Cerimônia externa",
        gastronomia: "Gastronomia",
        atendimento: "Atendimento",
        estrutura: "Estrutura",
        exclusividade: "Exclusividade",
        familiar: "Familiar",
        familia: "Família",
        natureza: "Natureza",
        festa_animada: "Festa animada",
        intimista: "Intimista",
        emocionante: "Emocionante"
      };

      return mapa[valor] || String(valor).replaceAll("_", " ");
    }

    function formatarEncantamentos(texto) {
      if (!texto) return "Não informado";

      return String(texto)
        .split("|")
        .map(item => item.trim())
        .filter(Boolean)
        .map(labelEncantamento)
        .join(" • ");
    }

    function formatarContato(casal) {
      if (!casal.ultimo_contato) return "Último contato não informado";
      return "Último contato: " + casal.ultimo_contato;
    }

    function trocarAba(tipo) {
      abaAtual = tipo;

      document.querySelectorAll(".card-resumo").forEach(card => {
        card.classList.remove("active");
      });

      document.getElementById("card-" + tipo).classList.add("active");
      document.getElementById("tituloLista").textContent = titulos[tipo];

      renderizarLista(tipo);
    }

    function renderizarLista(tipo) {
      const lista = document.getElementById("listaCasais");
      const empty = document.getElementById("emptyState");

      lista.innerHTML = "";

      if (!dados[tipo] || dados[tipo].length === 0) {
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      dados[tipo].forEach(casal => {
        const card = document.createElement("div");
        card.className = "card-casal";

        if (tipo === "agendados") {
          card.onclick = () => window.location.href = urlComUsuario("consultoria.html?casal_id=" + encodeURIComponent(casal.casal_id));
        } else {
          card.onclick = () => window.location.href = urlComUsuario("atendimento.html?casal_id=" + encodeURIComponent(casal.casal_id));
        }

        const nome = nomeCasal(casal);
        const sonhos = formatarEncantamentos(casal.encantamentos_principais);

        let statusTexto = "Oportunidade";
        let alerta = "Próxima ação: conduzir para agendamento.";
        let infoExtra = "";

        if (tipo === "agendar") {
          statusTexto =
            (normalizarStatus(casal.status_casal) === "NOVO" && !primeiraRespostaJaEnviada(casal))
              ? "Novo casal"
              : "Em atendimento";
          alerta = "Próxima ação: conduzir para agendamento.";
        }

        if (tipo === "resgatar") {
          statusTexto = "Visitou e não fechou";
          alerta = "Atenção: retomar contato e tentar resgatar.";
        }

        if (tipo === "agendados") {
          statusTexto = "Consultoria agendada";
          alerta = "Preparar visita presencial.";
          infoExtra = `
            <div class="linha-info">📍 Localização enviada automaticamente</div>
            <div class="linha-info">📝 Obs: ${casal.observacoes_gerais || "Sem observações"}</div>
          `;
        }

        card.innerHTML = `
          <div class="casal-top">
            <div class="avatar">${primeiraLetra(casal.nome_noiva)}</div>

            <div class="info-principal">
              <div class="nome">${nome}</div>
              <div class="telefone-card">📱 ${formatarTelefoneCard(casal.telefone || casal.telefone_noiva || casal.whatsapp)}</div>
              <div class="status">${statusTexto}</div>
            </div>

            <div class="seta">›</div>
          </div>

          <div class="linha-info">📅 ${casal.data_casamento || "Data não informada"} &nbsp; | &nbsp; 👥 ${casal.quantidade_convidados || "--"} convidados</div>

          ${tipo === "agendados"
            ? `<div class="linha-info">🗓 Consultoria: ${casal.data_consultoria || "--"} às ${casal.hora_consultoria || "--"}</div>`
            : `<div class="linha-info">⏱ ${formatarContato(casal)}</div>`
          }

          <div class="sonhos">✨ Sonhos: ${sonhos}</div>
          ${infoExtra}
          <div class="alerta">⚠️ ${alerta}</div>
        `;

        lista.appendChild(card);
      });
    }

    async function carregarOportunidades() {
      try {
        const resposta = await fetch(API_OPORTUNIDADES + "?t=" + Date.now());
        const retorno = await resposta.json();

        dados = organizarDadosPorStatus(retorno);

        document.getElementById("totalAgendar").textContent = dados.totais.agendar;
        document.getElementById("totalResgatar").textContent = dados.totais.resgatar;
        document.getElementById("totalAgendados").textContent = dados.totais.agendados;

        trocarAba(abaAtual);

      } catch (erro) {
        console.error("Erro ao carregar oportunidades:", erro);

        document.getElementById("listaCasais").innerHTML =
          '<div class="empty" style="display:block;">Erro ao carregar oportunidades.</div>';
      }
    }

    carregarOportunidades();

    if (abaAtual === "agendados") {
      setTimeout(carregarOportunidades, 900);
      setTimeout(carregarOportunidades, 1800);
    }
  </script>
</body>
</html>
