<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>CRM Espaço Margô - Atendimento</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f0ef;
      color: #2f2423;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      height: var(--app-height, 100dvh);
      margin: 0 auto;
      background: #ffffff;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      position: fixed;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
    }

    .header {
      padding: 14px 18px 9px;
      border-bottom: 1px solid #f1dddd;
      background: #ffffff;
      z-index: 10;
    }

    .top-nav {
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      margin-bottom: 6px;
    }

    .nav-arrow {
      width: 34px;
      height: 34px;
      border-radius: 14px;
      border: 1px solid #eadada;
      background: #fff;
      color: #d85f6f;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
    }

    .couple-name {
      text-align: center;
      font-size: 21px;
      font-weight: 900;
      color: #2f2423;
      line-height: 1.1;
    }

    .info-row {
      display: flex;
      justify-content: center;
      gap: 13px;
      margin-bottom: 7px;
      color: #7d6461;
      font-size: 12px;
      font-weight: 800;
    }

    .dreams {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      padding-bottom: 1px;
    }

    .dream-chip {
      background: #f8e9ea;
      border: 1px solid #efd2d5;
      color: #a35d61;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .chat-area {
      min-height: 0;
      padding: 12px 14px 14px;
      background:
        radial-gradient(circle at top left, rgba(248, 233, 234, .45), transparent 30%),
        #fffaf9;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .empty-chat {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #9f8a87;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      padding: 20px;
    }

    .message-row {
      display: flex;
      margin-bottom: 6px;
    }

    .message-row.received {
      justify-content: flex-start;
    }

    .message-row.sent {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      border-radius: 15px;
      padding: 7px 10px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.04);
    }

    .received .bubble {
      background: #ffffff;
      border: 1px solid #eadada;
      border-bottom-left-radius: 5px;
    }

    .sent .bubble {
      background: #f5dfe2;
      border: 1px solid #efc9ce;
      border-bottom-right-radius: 5px;
    }

    .text {
      font-size: 14px;
      line-height: 1.25;
      color: #2f2423;
    }

    .time {
      text-align: right;
      font-size: 9px;
      color: #9f8a87;
      margin-top: 3px;
      font-weight: 700;
    }

    .composer {
      width: 100%;
      background: #ffffff;
      border-top: 1px solid #f1dddd;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 1fr 40px 40px;
      gap: 7px;
      z-index: 20;
    }

    .composer input {
      border: 1px solid #eadada;
      border-radius: 18px;
      padding: 12px 14px;
      outline: none;
      font-size: 16px;
      color: #2f2423;
      background: #fffaf9;
    }

    .audio-btn,
    .send-btn {
      border: none;
      border-radius: 15px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .audio-btn {
      background: #b98286;
    }

    .send-btn {
      background: linear-gradient(135deg, #df6475, #d45167);
    }

    .bottom-nav {
      width: 100%;
      background: #ffffff;
      border-top: 1px solid #eadada;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 9px 0 10px;
      z-index: 20;
    }

    .nav-item {
      text-align: center;
      color: #8a8585;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-item span {
      display: block;
      font-size: 20px;
      margin-bottom: 2px;
    }

    .nav-item.active {
      color: #e15f70;
    }

    @media (min-width: 700px) {
      .phone-frame {
        top: 20px;
        height: calc(var(--app-height, 100dvh) - 40px);
        border-radius: 34px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      }

      .bottom-nav {
        border-radius: 0 0 34px 34px;
      }
    }
  </style>
</head>

<body>
  <div class="phone-frame" id="phoneFrame">
    <header class="header">
      <div class="top-nav">
        <button class="nav-arrow" onclick="voltarHome()">‹</button>
        <div class="couple-name" id="nomeCasal">Carregando...</div>
        <div></div>
      </div>

      <div class="info-row">
        <div id="dataCasamento">📅 --/--/----</div>
        <div id="qtdConvidados">👥 -- convidados</div>
      </div>

      <div class="dreams" id="sonhosCasal"></div>
    </header>

    <section class="chat-area" id="chatArea">
      <div class="empty-chat" id="emptyChat">
        Nenhuma mensagem registrada nesta conversa.
      </div>
    </section>

    <div class="composer">
      <input id="messageInput" type="text" placeholder="Digite sua mensagem..." autocomplete="off" />
      <button class="audio-btn" onclick="alert('Envio de áudio será ativado em breve.')">🎤</button>
      <button class="send-btn" onclick="enviarMensagem()">➤</button>
    </div>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="voltarHome()">
        <span>🏠</span>
        Início
      </div>

      <div class="nav-item" onclick="abrirConsultoria()">
        <span>📅</span>
        Agendar Consultoria
      </div>

      <div class="nav-item" onclick="alert('Histórico do casal será ativado em breve.')">
        <span>📜</span>
        Histórico
      </div>
    </nav>
  </div>

  <script>
    const API_CASAL = "https://n8n.espacomargo.com.br/webhook/crm/casal";
    const API_CONVERSAS = "https://n8n.espacomargo.com.br/webhook/crm/conversas";
    let casalAtualId = null;
    let usuarioAtualId = null;
    let casalAtual = {};

    function travarAlturaDaTela() {
      const altura = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty("--app-height", altura + "px");
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }

    travarAlturaDaTela();

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", travarAlturaDaTela);
      window.visualViewport.addEventListener("scroll", travarAlturaDaTela);
    }

    window.addEventListener("resize", travarAlturaDaTela);
    window.addEventListener("scroll", travarAlturaDaTela);

    document.addEventListener("touchmove", function (event) {
      if (!event.target.closest("#chatArea")) {
        event.preventDefault();
      }
    }, { passive: false });

    function pegarCasalIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("casal_id");
    }

    function pegarUsuarioIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("usuario_id");
    }

    function montarQueryUsuario() {
      if (!usuarioAtualId) return "";
      return "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function voltarHome() {
      const query = montarQueryUsuario();
      window.location.href = query ? "index.html?" + query : "index.html";
    }

    function nomeCasal(casal) {
      const noiva = casal.nome_noiva || "";
      const noivo = casal.nome_noivo || "";

      if (noiva && noivo) {
        return noiva + " ❤️ " + noivo;
      }

      return noiva || noivo || "Casal sem nome";
    }

    function formatarDataCasamento(data) {
      if (!data) return "📅 Data não informada";
      return "📅 " + data;
    }

    function formatarConvidados(qtd) {
      if (!qtd) return "👥 Convidados não informados";
      return "👥 " + qtd + " convidados";
    }

    function labelEncantamento(valor) {
      const mapa = {
        por_do_sol: "Pôr do sol",
        lago: "Lago",
        jardim: "Jardim",
        cerimonia_externa: "Cerimônia externa",
        gastronomia: "Gastronomia",
        atendimento: "Atendimento",
        estrutura: "Estrutura",
        exclusividade: "Exclusividade",
        familiar: "Familiar",
        familia: "Família",
        natureza: "Natureza",
        festa_animada: "Festa animada",
        intimista: "Intimista",
        emocionante: "Emocionante"
      };

      return mapa[valor] || String(valor).replaceAll("_", " ");
    }

    function renderizarEncantamentos(texto) {
      const container = document.getElementById("sonhosCasal");
      container.innerHTML = "";

      if (!texto) {
        container.innerHTML = '<div class="dream-chip">✨ Sem encantamentos</div>';
        return;
      }

      const itens = String(texto)
        .split("|")
        .map(item => item.trim())
        .filter(Boolean);

      if (itens.length === 0) {
        container.innerHTML = '<div class="dream-chip">✨ Sem encantamentos</div>';
        return;
      }

      itens.forEach(item => {
        const chip = document.createElement("div");
        chip.className = "dream-chip";
        chip.textContent = "✨ " + labelEncantamento(item);
        container.appendChild(chip);
      });
    }

    async function carregarCasal() {
      casalAtualId = pegarCasalIdDaUrl();
      usuarioAtualId = pegarUsuarioIdDaUrl();

      if (!casalAtualId) {
        document.getElementById("nomeCasal").textContent = "Casal não informado";
        return;
      }

      try {
        const resposta = await fetch(API_CASAL + "?casal_id=" + encodeURIComponent(casalAtualId));
        const casal = await resposta.json();

        if (casal.erro) {
          document.getElementById("nomeCasal").textContent = "Casal não encontrado";
          return;
        }

        casalAtual = casal;

        document.getElementById("nomeCasal").textContent = nomeCasal(casal);
        document.getElementById("dataCasamento").textContent = formatarDataCasamento(casal.data_casamento);
        document.getElementById("qtdConvidados").textContent = formatarConvidados(casal.quantidade_convidados);
        renderizarEncantamentos(casal.encantamentos_principais);
        await carregarHistoricoConversas();

        travarAlturaDaTela();

      } catch (erro) {
        console.error("Erro ao carregar casal:", erro);
        document.getElementById("nomeCasal").textContent = "Erro ao carregar";
      }
    }

    function abrirConsultoria() {
      let url = "consultoria.html";

      if (casalAtualId) {
        url += "?casal_id=" + encodeURIComponent(casalAtualId);

        if (usuarioAtualId) {
          url += "&usuario_id=" + encodeURIComponent(usuarioAtualId);
        }
      } else if (usuarioAtualId) {
        url += "?usuario_id=" + encodeURIComponent(usuarioAtualId);
      }

      window.location.href = url;
    }

    function esconderMensagemVazia() {
      const emptyChat = document.getElementById("emptyChat");
      if (emptyChat) {
        emptyChat.remove();
      }
    }

    function limparChat() {
      const chat = document.getElementById("chatArea");
      chat.innerHTML = '<div class="empty-chat" id="emptyChat">Nenhuma mensagem registrada nesta conversa.</div>';
    }

    function adicionarMensagemHistorico(conversa) {
      esconderMensagemVazia();

      const chat = document.getElementById("chatArea");

      const row = document.createElement("div");
      row.className = conversa.direcao === "ENTRADA" ? "message-row received" : "message-row sent";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const text = document.createElement("div");
      text.className = "text";

      if (conversa.tipo_mensagem === "AUDIO") {
        text.textContent = conversa.transcricao_audio || "🎤 Áudio recebido";
      } else {
        text.textContent = conversa.mensagem || "";
      }

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = conversa.data_hora || "";

      bubble.appendChild(text);
      bubble.appendChild(time);
      row.appendChild(bubble);
      chat.appendChild(row);
    }

    async function carregarHistoricoConversas() {
      if (!casalAtualId) return;

      try {
        limparChat();

        const resposta = await fetch(API_CONVERSAS + "?casal_id=" + encodeURIComponent(casalAtualId) + "&t=" + Date.now());
        const retorno = await resposta.json();

        if (!retorno.conversas || retorno.conversas.length === 0) {
          return;
        }

        retorno.conversas.forEach(conversa => {
          adicionarMensagemHistorico(conversa);
        });

        const chat = document.getElementById("chatArea");
        chat.scrollTop = chat.scrollHeight;

      } catch (erro) {
        console.error("Erro ao carregar histórico de conversas:", erro);
      }
    }

    function adicionarMensagemNaTela(texto) {
      esconderMensagemVazia();

      const chat = document.getElementById("chatArea");

      const row = document.createElement("div");
      row.className = "message-row sent";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const text = document.createElement("div");
      text.className = "text";
      text.textContent = texto;

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = new Date().toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      });

      bubble.appendChild(text);
      bubble.appendChild(time);
      row.appendChild(bubble);
      chat.appendChild(row);

      chat.scrollTop = chat.scrollHeight;
    }

    async function registrarMensagem(texto) {
      const payload = {
        casal_id: casalAtualId || "",
        telefone: casalAtual.telefone || "",
        consultora_responsavel: usuarioAtualId || casalAtual.consultora_responsavel || "",
        direcao: "SAIDA",
        tipo_mensagem: "TEXTO",
        mensagem: texto,
        audio_url: "",
        transcricao_audio: "",
        enviado_por: "CHO",
        origem_mensagem: "APP_CRM",
        status_registro: "REGISTRADO"
      };

      const resposta = await fetch(API_CONVERSAS, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!resposta.ok) {
        throw new Error("Erro ao registrar conversa");
      }

      return await resposta.json();
    }

    async function enviarMensagem() {
      const input = document.getElementById("messageInput");
      const texto = input.value.trim();

      if (!texto) return;

      input.value = "";
      adicionarMensagemNaTela(texto);

      try {
        await registrarMensagem(texto);
      } catch (erro) {
        console.error("Erro ao registrar mensagem:", erro);
        alert("A mensagem apareceu na tela, mas não foi registrada na planilha.");
      }

      travarAlturaDaTela();
    }

    document.getElementById("messageInput").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        enviarMensagem();
      }
    });

    document.getElementById("messageInput").addEventListener("focus", function () {
      setTimeout(travarAlturaDaTela, 50);
      setTimeout(travarAlturaDaTela, 250);
      setTimeout(travarAlturaDaTela, 500);
    });

    carregarCasal();
  </script>
</body>
</html>
