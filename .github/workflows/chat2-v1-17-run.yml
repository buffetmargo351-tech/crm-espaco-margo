name: CHAT2 V1.17 Runner

on:
  push:
    branches:
      - chat2/v1.17-navegacao-fila-empresas

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-v1.17-patch]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Aplicar patch
        run: python3 tools/chat2_v1_17_patch.py

      - name: Validar patch
        run: |
          git diff --check
          grep -q 'retornoOportunidades.empresas' home.html
          grep -q 'retorno.empresas' oportunidades.html
          grep -q 'id="navProximoFila"' atendimento.html
          grep -q 'function proximoAtendimentoFila' atendimento.html
          grep -q 'crm-margo-pwa-v17-fila-vertical-empresas-20260826' service-worker.js

      - name: Commit e push
        run: |
          git config user.name "CHAT2 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add home.html oportunidades.html atendimento.html service-worker.js README_V1_17_NAVEGACAO_FILA_EMPRESAS.txt
          if git diff --cached --quiet; then
            echo "Sem alterações para commit."
            exit 0
          fi
          git commit -m "V1.17 — navegação vertical em fila e correção Empresas [skip-v1.17-patch]"
          git push origin HEAD:${{ github.ref_name }}
