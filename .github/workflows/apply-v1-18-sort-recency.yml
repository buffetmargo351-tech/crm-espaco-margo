name: Apply V1.18 CRM recency ordering

on:
  push:
    paths:
      - ".github/workflows/apply-v1-18-sort-recency.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply recency ordering patch
        shell: python
        run: |
          from pathlib import Path

          MARKER = "CRM_SORT_RECENCY_V1"
          helper = r'''
              // CRM_SORT_RECENCY_V1 — filas ativas: mensagem/contato mais recente primeiro.
              // Interpreta datas brasileiras (dd/mm/aaaa, hh:mm:ss) e ISO sem depender de localeCompare.
              function parseTimestampCRM(valor) {
                const texto = String(valor || "").trim();
                if (!texto) return 0;

                const br = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:,\s*|\s+)?(?:(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
                if (br) {
                  const dia = Number(br[1]);
                  const mes = Number(br[2]) - 1;
                  const ano = Number(br[3]);
                  const hora = Number(br[4] || 0);
                  const minuto = Number(br[5] || 0);
                  const segundo = Number(br[6] || 0);
                  const d = new Date(ano, mes, dia, hora, minuto, segundo);
                  const ts = d.getTime();
                  return Number.isNaN(ts) ? 0 : ts;
                }

                const iso = Date.parse(texto);
                return Number.isNaN(iso) ? 0 : iso;
              }

              function timestampAtividadeLead(casal) {
                const candidatos = [
                  casal && casal.ultima_mensagem_lead_em,
                  casal && casal.ultimo_contato,
                  casal && casal.data_entrada,
                  casal && casal.created_at
                ];

                for (const valor of candidatos) {
                  const ts = parseTimestampCRM(valor);
                  if (ts) return ts;
                }

                return 0;
              }

              function ordenarPorAtividadeMaisRecente(lista) {
                return [...(Array.isArray(lista) ? lista : [])].sort((a, b) => {
                  const diferenca = timestampAtividadeLead(b) - timestampAtividadeLead(a);
                  if (diferenca !== 0) return diferenca;
                  return String(b && b.casal_id || "").localeCompare(String(a && a.casal_id || ""));
                });
              }

          '''

          def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
              raise SystemExit(f"{label}: esperado 1 trecho, encontrado {count}")
            return text.replace(old, new, 1)

          # home.html — NOVOS
          home_path = Path("home.html")
          home = home_path.read_text(encoding="utf-8")
          if MARKER not in home:
            anchor = "    function primeiraRespostaJaEnviada(casal) {"
            if anchor not in home:
              raise SystemExit("home.html: anchor primeiraRespostaJaEnviada não encontrado")
            home = home.replace(anchor, helper + anchor, 1)

          if "const casaisOrdenados = ordenarPorAtividadeMaisRecente(casaisNovos);" not in home:
            home = replace_once(
              home,
              '      if (!casaisNovos || casaisNovos.length === 0) {',
              '      const casaisOrdenados = ordenarPorAtividadeMaisRecente(casaisNovos);\n\n      if (!casaisOrdenados || casaisOrdenados.length === 0) {',
              "home.html ordenar NOVOS"
            )
            home = replace_once(
              home,
              '      totalNovos.textContent = casaisNovos.length;',
              '      totalNovos.textContent = casaisOrdenados.length;',
              "home.html total NOVOS"
            )
            home = replace_once(
              home,
              '      casaisNovos.forEach(casal => {',
              '      casaisOrdenados.forEach(casal => {',
              "home.html render NOVOS"
            )

          home_path.write_text(home, encoding="utf-8")

          # oportunidades.html — AGENDAR / EMPRESAS / ATENÇÃO
          op_path = Path("oportunidades.html")
          op = op_path.read_text(encoding="utf-8")
          if MARKER not in op:
            anchor = "    function primeiraRespostaJaEnviada(casal) {"
            if anchor not in op:
              raise SystemExit("oportunidades.html: anchor primeiraRespostaJaEnviada não encontrado")
            op = op.replace(anchor, helper + anchor, 1)

          if "const agendarOrdenado = ordenarPorAtividadeMaisRecente(agendar);" not in op:
            old = '''      return {
                agendar,
                resgatar,
                agendados,
                empresas,
                atencao,
                encerrados,'''
            new = '''      const agendarOrdenado = ordenarPorAtividadeMaisRecente(agendar);
              const empresasOrdenadas = ordenarPorAtividadeMaisRecente(empresas);
              const atencaoOrdenada = ordenarPorAtividadeMaisRecente(atencao);

              return {
                agendar: agendarOrdenado,
                resgatar,
                agendados,
                empresas: empresasOrdenadas,
                atencao: atencaoOrdenada,
                encerrados,'''
            op = replace_once(op, old, new, "oportunidades.html filas ativas")

          op_path.write_text(op, encoding="utf-8")

          readme = Path("README_V1_18_ORDENACAO_RECENCIA.txt")
          readme.write_text('''CRM ESPAÇO MARGÔ — V1.18 — ORDENAÇÃO POR RECÊNCIA\n\nREGRA HOMOLOGADA:\nNOVOS / AGENDAR / EMPRESAS / ATENÇÃO exibem primeiro o lead com atividade mais recente.\n\nCHAVE DE ORDENAÇÃO:\n1. ultima_mensagem_lead_em, quando existir;\n2. ultimo_contato;\n3. data_entrada;\n4. created_at.\n\nDatas brasileiras dd/mm/aaaa, hh:mm:ss são convertidas para timestamp real antes da comparação.\n\nAGENDADOS NÃO foi alterado: permanece ordenado pela data/hora da visita.\n\nNão altera fila, Milene, status comercial ou dados do casal; altera somente a ordem visual das filas ativas.\n''', encoding="utf-8")

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CRM_SORT_RECENCY_V1" home.html
          grep -q "CRM_SORT_RECENCY_V1" oportunidades.html
          grep -q "casaisOrdenados = ordenarPorAtividadeMaisRecente" home.html
          grep -q "agendarOrdenado = ordenarPorAtividadeMaisRecente" oportunidades.html
          grep -q "empresasOrdenadas = ordenarPorAtividadeMaisRecente" oportunidades.html
          grep -q "atencaoOrdenada = ordenarPorAtividadeMaisRecente" oportunidades.html

          python - <<'PY'
          import re
          from pathlib import Path
          for filename in ["home.html", "oportunidades.html"]:
              html = Path(filename).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S|re.I)
              Path(f"/tmp/{filename}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/home.html.js
          node --check /tmp/oportunidades.html.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- home.html oportunidades.html README_V1_18_ORDENACAO_RECENCIA.txt; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "crm-espaco-margo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add home.html oportunidades.html README_V1_18_ORDENACAO_RECENCIA.txt
          git commit -m "feat: ordenar filas ativas por contato mais recente"
          git push origin HEAD:main
