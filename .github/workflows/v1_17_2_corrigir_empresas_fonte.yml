name: V1.17.2 Corrigir EMPRESAS na fonte

on:
  push:
    paths:
      - '.github/workflows/v1_17_2_corrigir_empresas_fonte.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Aplicar correção permanente
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print(f'{label}: já aplicado')
                  return False
              if old not in text:
                  raise SystemExit(f'{label}: trecho esperado não encontrado em {path}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
              print(f'{label}: aplicado')
              return True

          # 1) oportunidades.html: incluir retorno.atencao na base usada para classificar EMPRESAS.
          replace_once(
              'oportunidades.html',
              '''        ...(retorno.agendados || []),\n        ...(retorno.empresas || []),\n        ...(retorno.encerrados || []),''',
              '''        ...(retorno.agendados || []),\n        ...(retorno.empresas || []),\n        ...(retorno.atencao || []),\n        ...(retorno.encerrados || []),''',
              'oportunidades inclui atencao'
          )

          # 2) oportunidades.html: preservar fila de origem para a navegação vertical.
          replace_once(
              'oportunidades.html',
              '''        card.onclick = () => window.location.href = urlComUsuario("atendimento.html?casal_id=" + encodeURIComponent(casal.casal_id));''',
              '''        card.onclick = () => window.location.href = urlComUsuario("atendimento.html?casal_id=" + encodeURIComponent(casal.casal_id) + "&fila=" + encodeURIComponent(tipo));''',
              'oportunidades preserva fila'
          )

          # 3) home.html: contador EMPRESAS também precisa enxergar corporativos que a API devolve em atencao.
          replace_once(
              'home.html',
              '''        ...(retornoOportunidades.agendados || []),\n        ...(retornoOportunidades.empresas || [])''',
              '''        ...(retornoOportunidades.agendados || []),\n        ...(retornoOportunidades.empresas || []),\n        ...(retornoOportunidades.atencao || [])''',
              'home inclui atencao'
          )

          # 4) Forçar renovação do PWA após deploy.
          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          import re
          sw_text, n = re.subn(
              r'const CACHE_NAME = "[^"]+";',
              'const CACHE_NAME = "crm-margo-pwa-v17-2-empresas-fonte-20260826";',
              sw_text,
              count=1
          )
          if n != 1:
              raise SystemExit('service-worker: CACHE_NAME não localizado')
          sw.write_text(sw_text, encoding='utf-8')

          # O hotfix do service-worker pode permanecer; após esta correção ele vira no-op.
          # Remove o workflow temporário no mesmo commit final.
          Path('.github/workflows/v1_17_2_corrigir_empresas_fonte.yml').unlink(missing_ok=True)

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html oportunidades.html service-worker.js .github/workflows/v1_17_2_corrigir_empresas_fonte.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar"
            exit 0
          fi
          git commit -m "V1.17.2 — Corrige EMPRESAS diretamente na fonte do App"
          git push origin HEAD:main
