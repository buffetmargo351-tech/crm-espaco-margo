name: Apply V1.15b

on:
  push:
    branches:
      - chat2/app-empresas-v1-15
    paths:
      - .github/workflows/apply-v1-15b.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat2/app-empresas-v1-15
          fetch-depth: 0
      - run: python tools/patch_v1_15b.py
      - run: grep -q 'repeat(3, 1fr)' atendimento.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atendimento.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: ajustar navegacao do atendimento corporativo"
          git push origin HEAD:chat2/app-empresas-v1-15
