name: CHAT2 Apply Attention Queue Patch

on:
  push:
    branches:
      - chat2/atencao-fila-humana
    paths:
      - .github/workflows/chat2-apply-atencao.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat2/atencao-fila-humana
          fetch-depth: 0
      - name: Aplicar patch
        run: |
          base64 -d tools/apply_atencao_patch.py.b64 > /tmp/apply_atencao_patch.py
          python /tmp/apply_atencao_patch.py
      - name: Validar e publicar na branch de teste
        run: |
          git config user.name "chat2-margo"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: fila Atenção para atendimentos humanos"
          git push origin HEAD:chat2/atencao-fila-humana
