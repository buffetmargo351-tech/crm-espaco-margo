name: CHAT2 Apply Attention Queue Patch

on:
  push:
    branches:
      - chat2/atencao-fila-humana
    paths:
      - .github/workflows/chat2-apply-atencao.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat2/atencao-fila-humana
          fetch-depth: 0

      - name: Aplicar implementação da fila Atenção
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: esperado 1 alvo, encontrado {count}")
              return text.replace(old, new, 1)

          # ============================================================
          # HOME — Atenção passa a ser fila HUMANA, não fila de revisão.
          # ============================================================
          p = Path("home.html")
          home = read(p)

          home = replace_once(
              home,
              '''    function abrirAtencao() {
      const secao = document.getElementById("mileneReviewSection");
      if (secao) secao.scrollIntoView({ behavior: "smooth", block: "start" });
    }''',
              '''    function abrirAtencao() {
      const q = usuarioAtualId ? "&usuario_id=" + encodeURIComponent(usuarioAtualId) : "";
      window.location.href = "oportunidades.html?aba=atencao" + q;
    }''',
              "home: abrirAtencao"
          )

          marcador = '''    function contarOportunidadesDaCHO(retornoOportunidades) {'''
          helpers = '''    function modoAtendimentoHumano(casal) {
      return String(casal && casal.modo_atendimento_ia || "").trim().toUpperCase() === "HUMANO";
    }

    function temVisitaAgendada(casal) {
      const status = normalizarStatus(casal && casal.status_casal);
      return status === "CONSULTORIA_AGENDADA" || Boolean(String(casal && casal.agenda_id || "").trim());
    }

    function unificarOportunidadesHome(retornoOportunidades) {
      const grupos = [
        ...(retornoOportunidades.agendar || []),
        ...(retornoOportunidades.resgatar || []),
        ...(retornoOportunidades.agendados || [])
      ];
      const mapa = new Map();
      grupos.forEach(casal => {
        if (casal && casal.casal_id && pertenceAoUsuario(casal)) {
          mapa.set(casal.casal_id, casal);
        }
      });
      return Array.from(mapa.values());
    }

    function contarAtencaoDaCHO(retornoOportunidades) {
      return unificarOportunidadesHome(retornoOportunidades).filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal)) return false;
        if (status === "PERDIDO" || status === "GANHO") return false;
        return modoAtendimentoHumano(casal);
      }).length;
    }

    function contarAgendadosDaCHO(retornoOportunidades) {
      return unificarOportunidadesHome(retornoOportunidades)
        .filter(temVisitaAgendada)
        .length;
    }

'''
          if home.count(marcador) != 1:
              raise RuntimeError("home: marcador contarOportunidadesDaCHO não encontrado de forma única")
          home = home.replace(marcador, helpers + marcador, 1)

          pattern = re.compile(r'''    function contarOportunidadesDaCHO\(retornoOportunidades\) \{.*?\n    \}\n\n    function renderizarCasais''', re.S)
          replacement = '''    function contarOportunidadesDaCHO(retornoOportunidades) {
      return unificarOportunidadesHome(retornoOportunidades).filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal)) return false;
        if (modoAtendimentoHumano(casal)) return false;
        return (
          status === "EM_ATENDIMENTO" ||
          status === "VISITOU_NAO_FECHOU" ||
          (status === "NOVO" && primeiraRespostaJaEnviada(casal))
        );
      }).length;
    }

    function renderizarCasais'''
          home, n = pattern.subn(replacement, home, count=1)
          if n != 1:
              raise RuntimeError(f"home: substituir contador oportunidades retornou {n}")

          home = replace_once(
              home,
              '''      const count = document.getElementById("mileneReviewCount");
      const countHome = document.getElementById("totalAtencaoHome");
      const title = document.getElementById("mileneReviewTitle");''',
              '''      const count = document.getElementById("mileneReviewCount");
      const title = document.getElementById("mileneReviewTitle");''',
              "home: separar contador revisão/atenção"
          )
          home = home.replace('''        if (countHome) countHome.textContent = "0";\n''', "", 1)
          home = home.replace('''      if (countHome) countHome.textContent = String(filtradas.length);\n''', "", 1)

          old_counts = '''          const agendadosHome = Array.isArray(dadosOportunidades && dadosOportunidades.agendados)
            ? dadosOportunidades.agendados.filter(pertenceAoUsuario) : [];
          const totalAgendadosHome = document.getElementById("totalAgendadosHome");
          if (totalAgendadosHome) totalAgendadosHome.textContent = String(agendadosHome.length);'''
          new_counts = '''          const totalAgendadosHome = document.getElementById("totalAgendadosHome");
          const totalAtencaoHome = document.getElementById("totalAtencaoHome");
          if (totalAgendadosHome) totalAgendadosHome.textContent = String(contarAgendadosDaCHO(dadosOportunidades));
          if (totalAtencaoHome) totalAtencaoHome.textContent = String(contarAtencaoDaCHO(dadosOportunidades));'''
          home = replace_once(home, old_counts, new_counts, "home: contadores operacionais")

          home = replace_once(
              home,
              '''          const resgatar = Array.isArray(dadosOportunidades && dadosOportunidades.resgatar)
            ? dadosOportunidades.resgatar
            : [];

          [...agendar, ...resgatar].forEach(casal => {''',
              '''          const resgatar = Array.isArray(dadosOportunidades && dadosOportunidades.resgatar)
            ? dadosOportunidades.resgatar
            : [];
          const agendados = Array.isArray(dadosOportunidades && dadosOportunidades.agendados)
            ? dadosOportunidades.agendados
            : [];

          [...agendar, ...resgatar, ...agendados].forEach(casal => {''',
              "home: ids válidos incluindo agendados"
          )

          # Em falha do endpoint, não deixar contadores antigos na tela.
          home = replace_once(
              home,
              '''        totalNovos.textContent = "0";
        totalOportunidadesEl.textContent = "0";''',
              '''        totalNovos.textContent = "0";
        totalOportunidadesEl.textContent = "0";
        const totalAgendadosHome = document.getElementById("totalAgendadosHome");
        const totalAtencaoHome = document.getElementById("totalAtencaoHome");
        if (totalAgendadosHome) totalAgendadosHome.textContent = "0";
        if (totalAtencaoHome) totalAtencaoHome.textContent = "0";''',
              "home: zerar contadores em erro"
          )

          write(p, home)

          # ============================================================
          # OPORTUNIDADES — grupos mutuamente exclusivos.
          # Precedência: AGENDADOS > ATENÇÃO(HUMANO) > filas normais.
          # ============================================================
          p = Path("oportunidades.html")
          opp = read(p)

          opp = replace_once(
              opp,
              '''    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);''',
              '''    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);''',
              "oportunidades: 4 cards"
          )

          css_anchor = '''    .card-resumo.encerrados.active {
      background: #eef7e9;
      border-color: #b9ddb5;
    }
'''
          css_add = css_anchor + '''
    .card-resumo.atencao .numero,
    .card-resumo.atencao .texto {
      color: #b66a31;
    }

    .card-resumo.atencao.active {
      background: #fff3e8;
      border-color: #e3b489;
    }
'''
          opp = replace_once(opp, css_anchor, css_add, "oportunidades: css atenção")

          old_cards = '''        <div class="card-resumo resgatar" id="card-resgatar" onclick="trocarAba('resgatar')">
          <div class="numero" id="totalResgatar">0</div>
          <div class="texto">Resgatar</div>
        </div>

        <div class="card-resumo agendados" id="card-encerrados" onclick="trocarAba('encerrados')">'''
          new_cards = '''        <div class="card-resumo resgatar" id="card-resgatar" onclick="trocarAba('resgatar')">
          <div class="numero" id="totalResgatar">0</div>
          <div class="texto">Resgatar</div>
        </div>

        <div class="card-resumo atencao" id="card-atencao" onclick="trocarAba('atencao')">
          <div class="numero" id="totalAtencao">0</div>
          <div class="texto">Atenção</div>
        </div>

        <div class="card-resumo agendados" id="card-encerrados" onclick="trocarAba('encerrados')">'''
          opp = replace_once(opp, old_cards, new_cards, "oportunidades: card atenção")

          opp = replace_once(
              opp,
              '''      agendados: [],
      encerrados: [],
      totais: {
        agendar: 0,
        resgatar: 0,
        agendados: 0,
        encerrados: 0''',
              '''      agendados: [],
      atencao: [],
      encerrados: [],
      totais: {
        agendar: 0,
        resgatar: 0,
        agendados: 0,
        atencao: 0,
        encerrados: 0''',
              "oportunidades: dados atenção"
          )

          opp = replace_once(
              opp,
              '''      agendados: "Visitas agendadas",
      encerrados: "Oportunidades encerradas"''',
              '''      agendados: "Visitas agendadas",
      atencao: "Atendimentos assumidos por você",
      encerrados: "Oportunidades encerradas"''',
              "oportunidades: título atenção"
          )

          opp = replace_once(
              opp,
              '''      if (aba === "resgatar" || aba === "encerrados" || aba === "agendados" || aba === "agendar") {''',
              '''      if (aba === "resgatar" || aba === "encerrados" || aba === "agendados" || aba === "atencao" || aba === "agendar") {''',
              "oportunidades: aba atenção"
          )

          marker_organizar = '''    function organizarDadosPorStatus(retorno) {'''
          opp_helpers = '''    function modoAtendimentoHumano(casal) {
      return String(casal && casal.modo_atendimento_ia || "").trim().toUpperCase() === "HUMANO";
    }

    function temVisitaAgendada(casal) {
      const status = normalizarStatus(casal && casal.status_casal);
      return status === "CONSULTORIA_AGENDADA" || Boolean(String(casal && casal.agenda_id || "").trim());
    }

'''
          if opp.count(marker_organizar) != 1:
              raise RuntimeError("oportunidades: marcador organizar não único")
          opp = opp.replace(marker_organizar, opp_helpers + marker_organizar, 1)

          pattern = re.compile(r'''    function organizarDadosPorStatus\(retorno\) \{.*?\n    \}\n\n    function chaveVisita''', re.S)
          replacement = '''    function organizarDadosPorStatus(retorno) {
      const todos = [
        ...(retorno.agendar || []),
        ...(retorno.resgatar || []),
        ...(retorno.agendados || []),
        ...(retorno.encerrados || [])
      ];

      const mapa = new Map();
      todos.forEach(casal => {
        if (casal && casal.casal_id) mapa.set(casal.casal_id, casal);
      });

      const unicos = Array.from(mapa.values()).filter(pertenceAoUsuario);

      // Precedência operacional: uma visita agendada pertence SOMENTE a AGENDADOS,
      // mesmo se o atendimento continuar em modo HUMANO.
      const agendados = unicos
        .filter(temVisitaAgendada)
        .sort((a, b) => chaveVisita(a).localeCompare(chaveVisita(b)));

      const encerrados = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return status === "PERDIDO";
      });

      const atencao = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal)) return false;
        if (status === "PERDIDO" || status === "GANHO") return false;
        return modoAtendimentoHumano(casal);
      });

      const agendar = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal) || modoAtendimentoHumano(casal)) return false;
        return status === "EM_ATENDIMENTO" ||
          (status === "NOVO" && primeiraRespostaJaEnviada(casal));
      });

      const resgatar = unicos.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        if (temVisitaAgendada(casal) || modoAtendimentoHumano(casal)) return false;
        return status === "VISITOU_NAO_FECHOU";
      });

      return {
        agendar,
        resgatar,
        agendados,
        atencao,
        encerrados,
        totais: {
          agendar: agendar.length,
          resgatar: resgatar.length,
          agendados: agendados.length,
          atencao: atencao.length,
          encerrados: encerrados.length
        }
      };
    }

    function chaveVisita'''
          opp, n = pattern.subn(replacement, opp, count=1)
          if n != 1:
              raise RuntimeError(f"oportunidades: substituir organizar retornou {n}")

          opp = replace_once(
              opp,
              '''        ["agendar", "resgatar", "agendados", "encerrados"].forEach(grupo => {''',
              '''        ["agendar", "resgatar", "agendados", "atencao", "encerrados"].forEach(grupo => {''',
              "oportunidades: resumo propostas atenção"
          )

          render_anchor = '''        if (tipo === "agendados") {
          statusTexto = "Visita agendada";
          alerta = "";
          const visita = [casal.data_consultoria || "", casal.hora_consultoria ? "às " + casal.hora_consultoria : ""]
            .filter(Boolean).join(" ");
          infoExtra = `<div class="linha-info">🗓 Visita: ${visita || "Horário não informado"}</div>`;
        }
'''
          render_add = render_anchor + '''
        if (tipo === "atencao") {
          statusTexto = "Atendimento humano";
          alerta = "A Milene está pausada. Este atendimento está sob sua responsabilidade.";
        }
'''
          opp = replace_once(opp, render_anchor, render_add, "oportunidades: render atenção")

          opp = replace_once(
              opp,
              '''        document.getElementById("totalResgatar").textContent = dados.totais.resgatar;
        document.getElementById("totalEncerrados").textContent = dados.totais.encerrados;''',
              '''        document.getElementById("totalResgatar").textContent = dados.totais.resgatar;
        document.getElementById("totalAtencao").textContent = dados.totais.atencao;
        document.getElementById("totalEncerrados").textContent = dados.totais.encerrados;''',
              "oportunidades: contador atenção"
          )

          write(p, opp)

          # ============================================================
          # ATENDIMENTO — botão ATENÇÃO no rodapé.
          # Usa endpoint de modo já existente; não cria status comercial novo.
          # ============================================================
          p = Path("atendimento.html")
          att = read(p)

          pattern = re.compile(r'''(    \.bottom-nav \{.*?grid-template-columns:\s*)repeat\(4,\s*1fr\);''', re.S)
          att, n = pattern.subn(r'''\1repeat(5, 1fr);''', att, count=1)
          if n != 1:
              raise RuntimeError(f"atendimento: grade bottom-nav retornou {n}")

          old_nav = '''      <div class="nav-item" onclick="abrirConsultoria()">
        <span>📝</span>
        Agendar
      </div>

      <div class="nav-item" onclick="alert('Histórico do casal será ativado em breve.')">'''
          new_nav = '''      <div class="nav-item" onclick="abrirConsultoria()">
        <span>📝</span>
        Agendar
      </div>

      <div class="nav-item" id="navAtencao" onclick="marcarAtencao()">
        <span>⚠️</span>
        Atenção
      </div>

      <div class="nav-item" onclick="alert('Histórico do casal será ativado em breve.')">'''
          att = replace_once(att, old_nav, new_nav, "atendimento: botão atenção")

          marker = '''    async function descartarRevisaoAntesDeEnvioManual() {'''
          func = '''    async function marcarAtencao() {
      if (!casalAtualId) return;

      const status = String(casalAtual && casalAtual.status_casal || "").trim().toUpperCase();
      const agendaId = String(casalAtual && casalAtual.agenda_id || "").trim();
      if (status === "CONSULTORIA_AGENDADA" || agendaId) {
        alert("Este casal já está em AGENDADOS. Não é necessário movê-lo também para ATENÇÃO.");
        return;
      }

      const modoAtual = String(casalAtual && casalAtual.modo_atendimento_ia || "").trim().toUpperCase();
      if (modoAtual === "HUMANO") {
        alert("Este casal já está em ATENÇÃO e permanece sob atendimento humano.");
        return;
      }

      if (!confirm("Mover este atendimento para ATENÇÃO e pausar a Milene para este casal?")) return;

      try {
        const resposta = await fetch(API_MODO_ATENDIMENTO_MILENE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            casal_id: casalAtualId,
            modo_atendimento_ia: "HUMANO",
            usuario_id: usuarioAtualId || ""
          })
        });

        let retorno = {};
        try { retorno = await resposta.json(); } catch (_) {}

        if (!resposta.ok || retorno.sucesso === false) {
          throw new Error(retorno.erro || retorno.mensagem || "Não foi possível mover para ATENÇÃO.");
        }

        casalAtual.modo_atendimento_ia = "HUMANO";
        esconderRevisaoPendente();
        atualizarDockModoHumano();
        alert("Casal movido para ATENÇÃO. A Milene está pausada para este atendimento.");
      } catch (erro) {
        alert("Não foi possível mover o casal para ATENÇÃO. " + (erro.message || ""));
      }
    }

'''
          if att.count(marker) != 1:
              raise RuntimeError("atendimento: marcador para função atenção não único")
          att = att.replace(marker, func + marker, 1)

          write(p, att)

          # ============================================================
          # PWA cache — versão nova para propagação controlada.
          # ============================================================
          p = Path("service-worker.js")
          sw = read(p)
          sw = replace_once(
              sw,
              'const CACHE_NAME = "crm-margo-pwa-v12-2-20260813";',
              'const CACHE_NAME = "crm-margo-pwa-v13-atencao-20260825";',
              "service-worker: cache v13"
          )
          write(p, sw)

          # Documentação operacional da versão.
          Path("README_V1_13_ATENCAO_HUMANA.txt").write_text('''CRM MARGÔ — V1.13 | FILA ATENÇÃO HUMANA

IMPLEMENTADO
- ATENÇÃO passa a representar atendimentos com modo_atendimento_ia = HUMANO.
- Casais em HUMANO deixam de aparecer nas filas normais de OPORTUNIDADES.
- Botão ATENÇÃO incluído no rodapé do atendimento, entre AGENDAR e HISTÓRICO.
- O botão usa o endpoint existente /crm/modo-atendimento-milene e grava HUMANO.
- Não foi criado novo status_casal: ATENÇÃO é fila operacional/responsabilidade, não etapa do funil.
- Precedência visual: VISITA AGENDADA > ATENÇÃO.
- Portanto, casal HUMANO que recebe agenda_id / CONSULTORIA_AGENDADA sai de ATENÇÃO e aparece somente em AGENDADOS.
- O modo HUMANO pode permanecer gravado internamente; a exclusividade é da fila visual.
- O card ATENÇÃO da Home não representa mais a quantidade de revisões pendentes da Milene.
- A fila de revisões continua existindo separadamente em MILENE • AGUARDANDO REVISÃO.

ARQUIVOS
- home.html
- oportunidades.html
- atendimento.html
- service-worker.js

TESTES MÍNIMOS
1. Abrir oportunidade AUTÔNOMA sem visita e tocar ATENÇÃO: deve passar a HUMANO.
2. Voltar à Home: OPORTUNIDADES -1 e ATENÇÃO +1.
3. Abrir ATENÇÃO: casal deve constar na fila.
4. Agendar visita para casal da ATENÇÃO: deve desaparecer de ATENÇÃO e constar apenas em AGENDADOS.
5. Casal já AGENDADO não deve ser movido para ATENÇÃO pelo botão do rodapé.
6. DEVOLVER PARA MILENE deve retirar o casal da fila ATENÇÃO quando não houver visita agendada.
''', encoding="utf-8")

          # Sanidade estrutural antes do commit.
          checks = {
              "home.html": ["aba=atencao", "contarAtencaoDaCHO", "contarAgendadosDaCHO"],
              "oportunidades.html": ["card-atencao", "atencao: []", "Atendimentos assumidos por você", "temVisitaAgendada"],
              "atendimento.html": ["id=\"navAtencao\"", "async function marcarAtencao()", "repeat(5, 1fr)"],
              "service-worker.js": ["crm-margo-pwa-v13-atencao-20260825"]
          }
          for file, needles in checks.items():
              text = read(file)
              for needle in needles:
                  if needle not in text:
                      raise RuntimeError(f"sanidade falhou: {needle} ausente em {file}")

          # O workflow é temporário: remove a si próprio do estado final da branch.
          wf = Path(".github/workflows/chat2-apply-atencao.yml")
          if wf.exists():
              wf.unlink()

      - name: Commit do patch
        run: |
          git config user.name "chat2-margo"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: fila Atenção para atendimentos humanos" || exit 0
          git push origin HEAD:chat2/atencao-fila-humana
