name: Apply V1.16 Empresas NOVO

on:
  push:
    branches:
      - chat2/app-empresas-v1-15
    paths:
      - tools/patch_v1_16_empresas_novos.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat2/app-empresas-v1-15
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/patch_v1_16_empresas_novos.py
      - name: Commit results
        run: |
          git config user.name "buffetmargo351-tech"
          git config user.email "buffetmargo351@gmail.com"
          git add home.html oportunidades.html service-worker.js README_V1_16_EMPRESAS_NOVOS.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: incluir corporativos NOVO na fila Empresas V1.16"
            git push origin HEAD:chat2/app-empresas-v1-15
          fi
