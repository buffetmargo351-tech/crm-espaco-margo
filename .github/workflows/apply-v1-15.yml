name: Apply V1.15 Empresas

on:
  push:
    branches:
      - chat2/app-empresas-v1-15
    paths:
      - .github/workflows/apply-v1-15.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chat2/app-empresas-v1-15
          fetch-depth: 0

      - name: Apply patch
        run: python tools/patch_v1_15_empresas.py

      - name: Validate expected markers
        run: |
          grep -q 'totalEmpresasHome' home.html
          grep -q 'card-empresas' oportunidades.html
          grep -q 'Empresas para atendimento' oportunidades.html
          grep -q 'A Milene não participa desta rota' atendimento.html
          grep -q 'crm-margo-pwa-v15-empresas-20260825' service-worker.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html oportunidades.html atendimento.html service-worker.js README_V1_15_EMPRESAS.txt
          git diff --cached --quiet && exit 0
          git commit -m "feat: V1.15 fila Empresas"
          git push origin HEAD:chat2/app-empresas-v1-15
