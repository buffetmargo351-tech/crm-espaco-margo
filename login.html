<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CRM Espaço Margô - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #f4f0ef;
      color: #2f2423;
    }

    body {
      overflow-x: hidden;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      margin: 0 auto;
      background: #ffffff;
      position: relative;
      box-shadow: 0 0 30px rgba(47, 36, 35, 0.08);
      display: flex;
      flex-direction: column;
    }

    .login-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 22px 30px;
    }

    .brand-card {
      width: 100%;
      border-radius: 30px;
      border: 1px solid #f1dddd;
      background: linear-gradient(180deg, #ffffff 0%, #fff8f8 100%);
      box-shadow: 0 18px 40px rgba(47, 36, 35, 0.10);
      padding: 30px 20px 22px;
      text-align: center;
    }

    .logo {
      text-align: center;
      line-height: 1;
      color: #d85f6f;
      margin-bottom: 22px;
    }

    .logo-small {
      display: block;
      font-size: 10px;
      letter-spacing: 3.5px;
      font-weight: 700;
      color: #c98288;
      margin-bottom: 3px;
    }

    .logo-main {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      letter-spacing: 2.5px;
      font-weight: 500;
      color: #d85f6f;
    }

    .login-title {
      font-size: 24px;
      font-weight: 900;
      color: #2f2423;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 14px;
      color: #7b6867;
      line-height: 1.35;
      margin-bottom: 22px;
    }

    .form {
      display: grid;
      gap: 13px;
      text-align: left;
    }

    .field-group {
      display: grid;
      gap: 7px;
    }

    .field-label {
      font-size: 13px;
      font-weight: 850;
      color: #3b2f2e;
      padding-left: 4px;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;
      height: 50px;
      border-radius: 18px;
      border: 1px solid #eadada;
      background: #ffffff;
      color: #2f2423;
      font-size: 16px;
      font-weight: 650;
      outline: none;
      padding: 0 15px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input:focus {
      border-color: #d85f6f;
      box-shadow: 0 0 0 4px rgba(216, 95, 111, 0.10);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      height: 32px;
      padding: 0 10px;
      border-radius: 12px;
      border: 1px solid #eadada;
      background: #fff7f7;
      color: #d85f6f;
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
    }

    .input-password {
      padding-right: 82px;
    }

    .primary-btn {
      width: 100%;
      min-height: 50px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      border: none;
      background: #d85f6f;
      color: #fff;
      box-shadow: 0 10px 18px rgba(216, 95, 111, 0.20);
      margin-top: 4px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .primary-btn:active,
    .password-toggle:active {
      transform: scale(0.985);
    }

    .primary-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    .message {
      min-height: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.35;
      margin-top: 12px;
      color: #7b6867;
    }

    .message.error {
      color: #b53a48;
    }

    .message.success {
      color: #2f7d51;
    }

    .system-note {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #f1dddd;
      font-size: 12px;
      color: #9a8584;
      text-align: center;
      line-height: 1.4;
    }

    .footer-version {
      text-align: center;
      color: #b5a2a1;
      font-size: 11px;
      padding: 0 16px 18px;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(244, 240, 239, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .loading-box {
      width: 210px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid #f1dddd;
      box-shadow: 0 18px 40px rgba(47, 36, 35, 0.13);
      padding: 22px 18px;
      text-align: center;
      color: #2f2423;
      font-size: 14px;
      font-weight: 850;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #f4d5d9;
      border-top-color: #d85f6f;
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <main class="login-wrap">
      <section class="brand-card">
        <div class="logo" aria-label="Espaço Margô">
          <span class="logo-small">ESPAÇO</span>
          <span class="logo-main">MARGÔ</span>
        </div>

        <h1 class="login-title">App de Atendimento</h1>
        <p class="login-subtitle">Entre com usuário e senha</p>

        <form class="form" id="loginForm" autocomplete="off">
          <div class="field-group">
            <label class="field-label" for="usuario">Usuário</label>
            <input class="input" id="usuario" name="usuario" type="text" autocomplete="username" />
          </div>

          <div class="field-group">
            <label class="field-label" for="senha">Senha</label>
            <div class="input-wrap">
              <input class="input input-password" id="senha" name="senha" type="password" autocomplete="current-password" />
              <button class="password-toggle" id="toggleSenha" type="button">Mostrar</button>
            </div>
          </div>

          <button class="primary-btn" id="btnEntrar" type="submit">Entrar</button>
        </form>

        <div class="message" id="mensagem"></div>

        <div class="system-note">Sistema indisponível, tente mais tarde.</div>
      </section>
    </main>

    <div class="footer-version">CRM Comercial Espaço Margô</div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      Validando acesso...
    </div>
  </div>

  <script>
    const API_VALIDAR_USUARIO = "https://n8n.espacomargo.com.br/webhook/crm/validar-usuario";

    const form = document.getElementById("loginForm");
    const usuarioInput = document.getElementById("usuario");
    const senhaInput = document.getElementById("senha");
    const toggleSenha = document.getElementById("toggleSenha");
    const btnEntrar = document.getElementById("btnEntrar");
    const mensagem = document.getElementById("mensagem");
    const loadingOverlay = document.getElementById("loadingOverlay");

    function limpar(valor) {
      return String(valor || "").trim();
    }

    function setMensagem(texto, tipo) {
      mensagem.textContent = texto || "";
      mensagem.className = "message" + (tipo ? " " + tipo : "");
    }

    function setLoading(ativo) {
      loadingOverlay.style.display = ativo ? "flex" : "none";
      btnEntrar.disabled = ativo;
      btnEntrar.textContent = ativo ? "Entrando..." : "Entrar";
    }

    function acessoSim(valor) {
      return String(valor || "").trim().toUpperCase() === "SIM";
    }

    function escolherDestino(usuario) {
      const acessos = usuario.acessos || {};
      const usuarioId = encodeURIComponent(usuario.usuario_id || "");
      const parametro = "?usuario_id=" + usuarioId;

      if (acessoSim(acessos.home)) {
        return "index.html" + parametro;
      }

      if (acessoSim(acessos.consultoria_cp)) {
        return "consultoria-cp.html" + parametro;
      }

      if (acessoSim(acessos.atendimento)) {
        return "index.html" + parametro;
      }

      if (acessoSim(acessos.oportunidades)) {
        return "oportunidades.html" + parametro;
      }

      if (acessoSim(acessos.perfil)) {
        return "perfil.html" + parametro;
      }

      if (acessoSim(acessos.simulador)) {
        return "simulador-lead.html" + parametro;
      }

      if (acessoSim(acessos.admin)) {
        return "admin-usuarios.html" + parametro;
      }

      return "";
    }

    function salvarSessao(usuario, senha) {
      const sessao = {
        usuario_id: usuario.usuario_id || "",
        nome_usuario: usuario.nome_usuario || "",
        tipo_usuario: usuario.tipo_usuario || "",
        status_usuario: usuario.status_usuario || "",
        foto_url: usuario.foto_url || "",
        acessos: usuario.acessos || {},
        senha_acesso: senha || "",
        data_login: new Date().toISOString()
      };

      localStorage.setItem("margo_usuario", JSON.stringify(sessao));
      localStorage.setItem("margo_usuario_id", usuario.usuario_id || "");
    }

    async function validarLogin(usuarioId, senhaAcesso) {
      const resposta = await fetch(API_VALIDAR_USUARIO, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          usuario_id: usuarioId,
          senha_acesso: senhaAcesso
        })
      });

      const texto = await resposta.text();

      try {
        return JSON.parse(texto);
      } catch (erro) {
        throw new Error("Resposta inválida do servidor");
      }
    }

    toggleSenha.addEventListener("click", () => {
      const visivel = senhaInput.type === "text";
      senhaInput.type = visivel ? "password" : "text";
      toggleSenha.textContent = visivel ? "Mostrar" : "Ocultar";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const usuarioId = limpar(usuarioInput.value).toLowerCase();
      const senhaAcesso = limpar(senhaInput.value);

      if (!usuarioId) {
        setMensagem("Informe o usuário.", "error");
        usuarioInput.focus();
        return;
      }

      if (!senhaAcesso) {
        setMensagem("Informe a senha.", "error");
        senhaInput.focus();
        return;
      }

      try {
        setMensagem("", "");
        setLoading(true);

        const dados = await validarLogin(usuarioId, senhaAcesso);

        if (!dados || dados.autorizado !== true) {
          setLoading(false);
          setMensagem(dados && dados.mensagem ? dados.mensagem : "Usuário ou senha inválidos.", "error");
          return;
        }

        const destino = escolherDestino(dados);

        if (!destino) {
          setLoading(false);
          setMensagem("Usuário sem acesso liberado.", "error");
          return;
        }

        salvarSessao(dados, senhaAcesso);
        setMensagem("Acesso autorizado.", "success");

        setTimeout(() => {
          window.location.href = destino;
        }, 450);
      } catch (erro) {
        console.error(erro);
        setLoading(false);
        setMensagem("Sistema indisponível, tente mais tarde.", "error");
      }
    });
  </script>
</body>
</html>
