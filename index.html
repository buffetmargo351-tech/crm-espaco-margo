<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Espaço Margô - Home Office</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f4f0ef;
      color: #2f2423;
      min-height: 100vh;
    }

    .phone-frame {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .app {
      padding: 24px 22px 28px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .menu-icon,
    .bell-icon {
      font-size: 25px;
      color: #4a2f2d;
      cursor: pointer;
    }

    .logo {
      text-align: center;
      color: #b98286;
      line-height: 1.1;
    }

    .logo-small {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 500;
    }

    .logo-main {
      font-size: 29px;
      letter-spacing: 2px;
      font-family: Georgia, serif;
    }

    .saudacao {
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 4px;
    }

    .frase {
      font-size: 12px;
      color: #8b6f6c;
      margin-bottom: 15px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 22px;
    }

    .card-resumo {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 13px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .card-resumo .numero {
      font-size: 20px;
      font-weight: 900;
      color: #dc6572;
      line-height: 1;
    }

    .card-resumo .texto {
      font-size: 9px;
      font-weight: 800;
      color: #cf6973;
      line-height: 1;
      white-space: nowrap;
    }

    .secao-titulo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 12px;
    }

    .secao-titulo h2 {
      font-size: 14px;
      color: #e15f70;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .linha {
      flex: 1;
      height: 1px;
      background: #eadada;
    }

    .casal-card {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 16px;
      padding: 14px 15px;
      margin-bottom: 11px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .linha-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: #f8e9ea;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d85f6f;
      font-weight: 900;
      font-size: 17px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .nome {
      font-size: 14px;
      font-weight: 900;
      color: #2f2423;
      margin-bottom: 3px;
    }

    .sub {
      font-size: 11px;
      color: #8b6f6c;
      line-height: 1.3;
    }

    .tag {
      background: #fde8e9;
      color: #a35d61;
      font-size: 10px;
      font-weight: 900;
      padding: 7px 8px;
      border-radius: 9px;
      white-space: nowrap;
    }

    .seta {
      color: #b98286;
      font-size: 22px;
      font-weight: 300;
    }

    .empty {
      font-size: 12px;
      color: #8b6f6c;
      text-align: center;
      margin-top: 28px;
      font-weight: 700;
      line-height: 1.35;
    }

    @media (min-width: 700px) {
      body {
        padding: 20px 0;
      }

      .phone-frame {
        min-height: calc(100vh - 40px);
        border-radius: 34px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      }
    }
  </style>
</head>

<body>
  <div class="phone-frame">
    <main class="app">
      <header>
        <div class="top-bar">
          <div class="menu-icon" onclick="abrirPerfil()">☰</div>

          <div class="logo">
            <div class="logo-small">ESPAÇO</div>
            <div class="logo-main">MARGÔ</div>
          </div>

          <div class="bell-icon">🔔</div>
        </div>

        <div class="saudacao" id="saudacao">Bom dia ☀️</div>
        <div class="frase" id="fraseMotivacional">Vamos encantar noivas hoje?</div>
      </header>

      <section class="cards-resumo">
        <div class="card-resumo" onclick="irParaSecao('novos')">
          <div class="numero" id="totalNovos">0</div>
          <div class="texto">Novos</div>
        </div>

        <div class="card-resumo" onclick="abrirOportunidades()">
          <div class="numero" id="totalOportunidades">0</div>
          <div class="texto">Oportunidades</div>
        </div>

        <div class="card-resumo" onclick="alert('Tela Resultados será ativada em breve.')">
          <div class="numero">0</div>
          <div class="texto">Resultados</div>
        </div>
      </section>

      <section id="novos">
        <div class="secao-titulo">
          <h2>📥 NOVOS CASAIS</h2>
          <div class="linha"></div>
        </div>

        <div id="listaCasais">
          <div class="empty">Carregando novos casais...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_CASAIS = "https://n8n.espacomargo.com.br/webhook/crm/casais";
    const API_USUARIOS = "https://n8n.espacomargo.com.br/webhook/crm/usuarios";

    let usuarioAtualId = pegarUsuarioIdDaUrl();
    let usuarioAtual = null;

    const frases = [
      "Vamos encantar noivas hoje?",
      "Cada casal merece sentir que é único.",
      "Encantar é ouvir antes de apresentar.",
      "Hoje alguém pode encontrar o lugar dos sonhos.",
      "Uma visita pode mudar toda uma história.",
      "Cuidado transforma conversa em confiança.",
      "O amor já existe. Nós ajudamos a celebrar."
    ];

    const fraseEscolhida = frases[Math.floor(Math.random() * frases.length)];
    document.getElementById("fraseMotivacional").textContent = fraseEscolhida;

    function pegarUsuarioIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("usuario_id") || "";
    }

    function queryUsuario() {
      if (!usuarioAtualId) return "";
      return "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function abrirPerfil() {
      const query = queryUsuario();
      window.location.href = query ? "perfil.html?" + query : "perfil.html";
    }

    function abrirAtendimento(casalId) {
      let url = "atendimento.html";

      if (casalId) {
        url += "?casal_id=" + encodeURIComponent(casalId);
        if (usuarioAtualId) {
          url += "&usuario_id=" + encodeURIComponent(usuarioAtualId);
        }
      } else if (usuarioAtualId) {
        url += "?usuario_id=" + encodeURIComponent(usuarioAtualId);
      }

      window.location.href = url;
    }

    function abrirOportunidades() {
      const query = queryUsuario();
      window.location.href = query ? "oportunidades.html?" + query : "oportunidades.html";
    }

    function irParaSecao(id) {
      document.getElementById(id).scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function primeiraLetra(nome) {
      if (!nome) return "?";
      return nome.trim().charAt(0).toUpperCase();
    }

    function nomeCasal(casal) {
      const noiva = casal.nome_noiva || "";
      const noivo = casal.nome_noivo || "";

      if (noiva && noivo) {
        return noiva + " e " + noivo;
      }

      return noiva || noivo || "Casal sem nome";
    }

    function formatarSubtitulo(casal) {
      const origem = casal.origem || "Origem não informada";
      const entrada = casal.data_entrada ? "Entrou em " + casal.data_entrada : "Entrada não informada";
      return entrada + " · " + origem;
    }

    function normalizarStatus(status) {
      return String(status || "").trim().toUpperCase();
    }

    function pertenceAoUsuario(casal) {
      if (!usuarioAtualId) return true;
      return String(casal.consultora_responsavel || "").trim() === String(usuarioAtualId).trim();
    }

    function filtrarCasaisDaCHO(casais) {
      return casais.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return status === "NOVO" && pertenceAoUsuario(casal);
      });
    }

    function contarOportunidadesDaCHO(casais) {
      return casais.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        const ehOportunidade =
          status === "NOVO" ||
          status === "EM_ATENDIMENTO" ||
          status === "CONSULTORIA_AGENDADA" ||
          status === "VISITOU_NAO_FECHOU";

        return ehOportunidade && pertenceAoUsuario(casal);
      }).length;
    }

    function renderizarCasais(casaisNovos, totalOportunidades) {
      const lista = document.getElementById("listaCasais");
      const totalNovos = document.getElementById("totalNovos");
      const totalOportunidadesEl = document.getElementById("totalOportunidades");

      lista.innerHTML = "";
      totalOportunidadesEl.textContent = totalOportunidades;

      if (!casaisNovos || casaisNovos.length === 0) {
        totalNovos.textContent = "0";
        lista.innerHTML = '<div class="empty">Nenhum novo casal para esta consultora no momento.</div>';
        return;
      }

      totalNovos.textContent = casaisNovos.length;

      casaisNovos.forEach(casal => {
        const card = document.createElement("div");
        card.className = "casal-card";
        card.onclick = () => abrirAtendimento(casal.casal_id);

        card.innerHTML = `
          <div class="linha-card">
            <div class="avatar">${primeiraLetra(casal.nome_noiva)}</div>

            <div class="info">
              <div class="nome">${nomeCasal(casal)}</div>
              <div class="sub">${formatarSubtitulo(casal)}</div>
            </div>

            <div class="tag">Novo</div>
            <div class="seta">›</div>
          </div>
        `;

        lista.appendChild(card);
      });
    }

    async function carregarUsuario() {
      if (!usuarioAtualId) {
        document.getElementById("saudacao").textContent = "Bom dia ☀️";
        return;
      }

      try {
        const resposta = await fetch(API_USUARIOS + "?t=" + Date.now());
        const dados = await resposta.json();

        const usuarios = dados.usuarios || [];
        usuarioAtual = usuarios.find(usuario => {
          return String(usuario.usuario_id || "").trim() === String(usuarioAtualId).trim();
        });

        if (usuarioAtual && usuarioAtual.nome) {
          document.getElementById("saudacao").textContent = "Bom dia, " + usuarioAtual.nome + " ☀️";
        } else {
          document.getElementById("saudacao").textContent = "Bom dia, consultora ☀️";
        }

      } catch (erro) {
        console.error("Erro ao carregar usuário:", erro);
        document.getElementById("saudacao").textContent = "Bom dia, consultora ☀️";
      }
    }

    async function carregarCasais() {
      try {
        const resposta = await fetch(API_CASAIS + "?t=" + Date.now());
        const dados = await resposta.json();

        const casais = Array.isArray(dados) ? dados : [dados];

        const casaisNovos = filtrarCasaisDaCHO(casais);
        const totalOportunidades = contarOportunidadesDaCHO(casais);

        renderizarCasais(casaisNovos, totalOportunidades);

      } catch (erro) {
        console.error("Erro ao carregar casais:", erro);

        document.getElementById("listaCasais").innerHTML =
          '<div class="empty">Não foi possível carregar os casais agora.</div>';

        document.getElementById("totalNovos").textContent = "0";
        document.getElementById("totalOportunidades").textContent = "0";
      }
    }

    async function iniciarHome() {
      await carregarUsuario();
      await carregarCasais();

      setTimeout(carregarCasais, 900);
      setTimeout(carregarCasais, 1800);
    }

    window.addEventListener("pageshow", function () {
      carregarCasais();
    });

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        carregarCasais();
      }
    });

    iniciarHome();
  </script>
</body>
</html>
