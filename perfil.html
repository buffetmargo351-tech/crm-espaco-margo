<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Espaço Margô - Perfil</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f4f0ef;
      color: #2f2423;
      min-height: 100vh;
    }

    .phone-frame {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }

    .app {
      padding: 20px 18px 92px;
      min-height: 100vh;
    }

    .top {
      display: grid;
      grid-template-columns: 42px 1fr 42px;
      align-items: center;
      margin-bottom: 20px;
    }

    .back {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      border: 1px solid #eadada;
      background: #ffffff;
      color: #d85f6f;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
    }

    .page-title {
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      color: #2f2423;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 13px;
      border: 1px solid #eadada;
      background: #ffffff;
      color: #d85f6f;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .profile {
      text-align: center;
      margin-bottom: 18px;
    }

    .photo {
      width: 102px;
      height: 102px;
      border-radius: 50%;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, #f8e9ea, #fffaf9);
      border: 1px solid #eadada;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d85f6f;
      font-size: 38px;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      font-size: 22px;
      font-weight: 950;
      color: #2f2423;
      margin-bottom: 3px;
    }

    .role {
      font-size: 13px;
      font-weight: 900;
      color: #d85f6f;
      margin-bottom: 9px;
    }

    .contact {
      display: none;
      font-size: 12px;
      color: #7d6461;
      font-weight: 800;
      line-height: 1.7;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0 12px;
      color: #e15f70;
      font-size: 13px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .section-label::before,
    .section-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #eadada;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .result-card {
      border: 1px solid #eadada;
      border-radius: 18px;
      padding: 14px 12px;
      min-height: 158px;
      background: #fffaf9;
      box-shadow: 0 8px 18px rgba(0,0,0,0.045);
    }

    .result-card.open {
      background: #fff7ec;
      border-color: #efd5ad;
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 17px;
      background: #f8e9ea;
      color: #d85f6f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 10px;
    }

    .open .card-icon {
      background: #ffe5c8;
      color: #d96b14;
    }

    .card-title {
      font-size: 12px;
      font-weight: 950;
      color: #d85f6f;
      text-transform: uppercase;
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .open .card-title {
      color: #d96b14;
    }

    .big-number {
      font-size: 34px;
      line-height: 1;
      font-weight: 950;
      color: #2f2423;
      margin-bottom: 4px;
    }

    .caption {
      font-size: 12px;
      color: #5f5452;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 13px;
    }

    .money {
      border-top: 1px solid #eadada;
      padding-top: 10px;
      font-size: 18px;
      font-weight: 950;
      color: #d85f6f;
      line-height: 1.15;
    }

    .open .money {
      color: #d96b14;
    }

    .money small {
      display: block;
      font-size: 10px;
      font-weight: 800;
      color: #8b6f6c;
      margin-top: 2px;
    }

    .hidden {
      display: none !important;
    }

    .resgate-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #df6475, #d45167);
      color: #ffffff;
      font-size: 13px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 9px 18px rgba(216,95,111,0.2);
      margin-bottom: 18px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-top: 1px solid #eadada;
      display: grid;
      grid-template-columns: 1fr;
      padding: 9px 0 10px;
      z-index: 20;
    }

    .nav-item {
      text-align: center;
      color: #e15f70;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .nav-item span {
      display: block;
      font-size: 20px;
      margin-bottom: 2px;
    }

    @media (min-width: 700px) {
      body {
        padding: 20px 0;
      }

      .phone-frame {
        min-height: calc(100vh - 40px);
        border-radius: 34px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      }

      .bottom-nav {
        border-radius: 0 0 34px 34px;
      }
    }
  </style>
</head>

<body>
  <div class="phone-frame">
    <main class="app">
      <header class="top">
        <button class="back" onclick="abrirMenu()">☰</button>

        <div class="page-title">Meu Perfil</div>

        <div></div>
      </header>

      <section class="profile">
        <div class="photo" id="fotoPerfil">
          ?
        </div>

        <div class="name" id="nomePerfil">Carregando...</div>
        <div class="role" id="tipoPerfil">Consultora</div>

        <div class="contact" id="contatoPerfil">
          📱 --<br>
          ✉️ --
        </div>
      </section>

      <div class="section-label">Meus Resultados</div>

      <section class="result-grid">
        <div class="result-card">
          <div class="card-icon">🏆</div>
          <div class="card-title">Mês atual</div>

          <div class="big-number">0</div>
          <div class="caption">contratos fechados</div>

          <div class="money" id="comissaoMesAtual">
            R$ 0,00
            <small id="labelComissaoMesAtual">em comissão</small>
          </div>
        </div>

        <div class="result-card open">
          <div class="card-icon">🔥</div>
          <div class="card-title">Em aberto</div>

          <div class="big-number">0</div>
          <div class="caption">casais para resgatar</div>

          <div class="money" id="comissaoEmAberto">
            R$ 0,00
            <small id="labelComissaoEmAberto">potencial de comissão</small>
          </div>
        </div>
      </section>

      <button class="resgate-btn" onclick="abrirResgates()">
        ❤️ IR PARA RESGATES
      </button>
    </main>

    <nav class="bottom-nav">
      <div class="nav-item" onclick="voltarHome()">
        <span>🏠</span>
        Início
      </div>
    </nav>
  </div>

  <script>
    const API_USUARIOS = "https://n8n.espacomargo.com.br/webhook/crm/listar-usuarios";
    const API_USUARIOS_ALTERNATIVO = "https://n8n.espacomargo.com.br/webhook/crm/usuarios";

    let usuarioAtualId = pegarUsuarioIdDaUrl();

    function limpar(valor) {
      return String(valor || "").trim();
    }

    function lerSessao() {
      try {
        return JSON.parse(localStorage.getItem("margo_usuario") || "null");
      } catch (erro) {
        return null;
      }
    }

    function pegarUsuarioIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("usuario_id") || localStorage.getItem("margo_usuario_id") || "";
    }

    function montarQueryUsuario() {
      if (!usuarioAtualId) return "";
      return "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function abrirMenu() {
      const query = montarQueryUsuario();
      window.location.href = query ? "menu.html?" + query : "menu.html";
    }

    function voltarHome() {
      const query = montarQueryUsuario();
      window.location.href = query ? "home.html?" + query : "home.html";
    }

    function abrirResgates() {
      let url = "oportunidades.html?aba=resgatar";

      if (usuarioAtualId) {
        url += "&usuario_id=" + encodeURIComponent(usuarioAtualId);
      }

      window.location.href = url;
    }

    function primeiraLetra(nome) {
      const texto = limpar(nome);
      if (!texto) return "?";
      return texto.charAt(0).toUpperCase();
    }

    function labelTipoUsuario(tipo) {
      const valor = String(tipo || "").trim().toUpperCase();

      if (valor === "CHO") return "Consultora Home Office";
      if (valor === "CP") return "Consultora Presencial";
      if (valor === "ADMIN") return "Administrador";

      return "Usuário";
    }

    function primeiraFuncaoDisponivel(usuario) {
      return (
        limpar(usuario.funcao_exibicao) ||
        limpar(usuario.funcao) ||
        limpar(usuario.cargo) ||
        limpar(usuario.perfil_exibicao) ||
        labelTipoUsuario(usuario.tipo_usuario)
      );
    }

    function primeiroPercentualDisponivel(usuario) {
      return (
        limpar(usuario.percentual_comissao) ||
        limpar(usuario.comissao_percentual) ||
        limpar(usuario.percentual) ||
        limpar(usuario.comissao)
      );
    }

    function formatarPercentualComissao(valor) {
      const texto = limpar(valor);

      if (!texto) return "";

      if (texto.includes("%")) return texto;

      const numero = Number(texto.replace(",", "."));

      if (Number.isNaN(numero) || numero <= 0) return "";

      const percentual = numero <= 1 ? numero * 100 : numero;

      return percentual.toLocaleString("pt-BR", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }) + "%";
    }

    function normalizarFotoUrl(usuario) {
      let url = (
        limpar(usuario.foto_url) ||
        limpar(usuario.url_foto) ||
        limpar(usuario.foto) ||
        limpar(usuario.foto_perfil) ||
        limpar(usuario.imagem_url)
      );

      if (!url) return "";

      if (url.startsWith("http://") || url.startsWith("https://")) {
        return url;
      }

      if (url.startsWith("/")) {
        return window.location.origin + url;
      }

      return window.location.origin + "/" + url;
    }

    function normalizarUsuario(usuario) {
      return {
        usuario_id: limpar(usuario.usuario_id),
        nome: limpar(usuario.nome_usuario || usuario.nome),
        tipo_usuario: limpar(usuario.tipo_usuario),
        funcao_exibicao: primeiraFuncaoDisponivel(usuario),
        foto_url: normalizarFotoUrl(usuario),
        percentual_comissao: primeiroPercentualDisponivel(usuario)
      };
    }

    function renderizarFoto(usuario) {
      const foto = document.getElementById("fotoPerfil");
      foto.innerHTML = "";

      if (usuario.foto_url) {
        const img = document.createElement("img");
        img.src = usuario.foto_url;
        img.alt = usuario.nome || "Foto da consultora";
        img.onerror = function () {
          foto.innerHTML = primeiraLetra(usuario.nome);
        };
        foto.appendChild(img);
      } else {
        foto.textContent = primeiraLetra(usuario.nome);
      }
    }

    function renderizarComissao(usuario) {
      const percentual = formatarPercentualComissao(usuario.percentual_comissao);
      const comissaoMesAtual = document.getElementById("comissaoMesAtual");
      const comissaoEmAberto = document.getElementById("comissaoEmAberto");
      const labelMesAtual = document.getElementById("labelComissaoMesAtual");
      const labelEmAberto = document.getElementById("labelComissaoEmAberto");

      if (!percentual) {
        comissaoMesAtual.classList.add("hidden");
        comissaoEmAberto.classList.add("hidden");
        return;
      }

      comissaoMesAtual.classList.remove("hidden");
      comissaoEmAberto.classList.remove("hidden");

      labelMesAtual.textContent = "em comissão (" + percentual + ")";
      labelEmAberto.textContent = "potencial de comissão (" + percentual + ")";
    }

    function renderizarUsuario(usuarioBruto) {
      const usuario = normalizarUsuario(usuarioBruto);
      renderizarFoto(usuario);
      renderizarComissao(usuario);

      document.getElementById("nomePerfil").textContent = usuario.nome || "Perfil";
      document.getElementById("tipoPerfil").textContent = usuario.funcao_exibicao || labelTipoUsuario(usuario.tipo_usuario);
      document.getElementById("contatoPerfil").innerHTML = "";
    }

    function extrairListaUsuarios(dados) {
      if (Array.isArray(dados)) return dados;
      if (dados && Array.isArray(dados.usuarios)) return dados.usuarios;
      if (dados && Array.isArray(dados.data)) return dados.data;
      if (dados && dados.usuario_id) return [dados];
      return [];
    }

    function campoPreenchido(valor) {
      return limpar(valor) !== "";
    }

    function combinarUsuarios(base, extra) {
      const combinado = Object.assign({}, base || {});

      Object.keys(extra || {}).forEach(chave => {
        if (!campoPreenchido(combinado[chave]) && campoPreenchido(extra[chave])) {
          combinado[chave] = extra[chave];
        }
      });

      return combinado;
    }

    async function buscarUsuarioEmApi(url) {
      try {
        const resposta = await fetch(url + "?t=" + Date.now());
        const dados = await resposta.json();
        const usuarios = extrairListaUsuarios(dados);

        return usuarios.find(item => {
          return String(item.usuario_id || "").trim() === String(usuarioAtualId).trim();
        }) || null;
      } catch (erro) {
        console.warn("Erro ao buscar usuário em", url, erro);
        return null;
      }
    }

    async function buscarUsuarioCompleto() {
      const usuarioPrincipal = await buscarUsuarioEmApi(API_USUARIOS);
      const usuarioAlternativo = await buscarUsuarioEmApi(API_USUARIOS_ALTERNATIVO);
      return combinarUsuarios(usuarioPrincipal, usuarioAlternativo);
    }

    async function carregarUsuario() {
      const sessao = lerSessao();

      if (sessao && limpar(sessao.usuario_id) === limpar(usuarioAtualId)) {
        renderizarUsuario(sessao);
      }

      if (!usuarioAtualId) {
        document.getElementById("nomePerfil").textContent = "Perfil";
        document.getElementById("tipoPerfil").textContent = "";
        document.getElementById("contatoPerfil").innerHTML = "";
        return;
      }

      try {
        const usuario = await buscarUsuarioCompleto();

        if (!usuario || !usuario.usuario_id) {
          if (!(sessao && limpar(sessao.usuario_id) === limpar(usuarioAtualId))) {
            document.getElementById("nomePerfil").textContent = "Perfil";
            document.getElementById("tipoPerfil").textContent = "";
            document.getElementById("contatoPerfil").innerHTML = "";
          }
          return;
        }

        renderizarUsuario(usuario);

      } catch (erro) {
        console.error("Erro ao carregar perfil:", erro);
        if (!(sessao && limpar(sessao.usuario_id) === limpar(usuarioAtualId))) {
          document.getElementById("nomePerfil").textContent = "Perfil";
        }
      }
    }

    carregarUsuario();
  </script>
</body>
</html>
