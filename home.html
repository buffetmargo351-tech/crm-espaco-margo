<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b98286" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CRM Margô" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>CRM Espaço Margô - Home Office</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f4f0ef;
      color: #2f2423;
      min-height: 100vh;
    }

    .phone-frame {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .app {
      padding: 24px 22px 28px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .menu-icon {
      font-size: 25px;
      color: #4a2f2d;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .usuario-topo {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      border: 1px solid #eadada;
      background: #fff7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
      box-shadow: 0 6px 14px rgba(0,0,0,0.05);
    }

    .usuario-foto-topo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d85f6f;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .usuario-foto-topo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo {
      text-align: center;
      color: #b98286;
      line-height: 1.1;
    }

    .menu-opcoes {
      position: absolute;
      top: 62px;
      left: 22px;
      width: 190px;
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 16px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.14);
      padding: 8px;
      z-index: 20;
    }

    .menu-opcoes.hidden {
      display: none;
    }

    .menu-opcao {
      width: 100%;
      border: none;
      background: transparent;
      color: #4a2f2d;
      font-size: 13px;
      font-weight: 800;
      padding: 11px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }

    .menu-opcao:hover {
      background: #fbf0f1;
      color: #c45668;
    }


    .logo-small {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 500;
    }

    .logo-main {
      font-size: 29px;
      letter-spacing: 2px;
      font-family: Georgia, serif;
    }

    .saudacao {
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 4px;
    }

    .frase {
      font-size: 12px;
      color: #8b6f6c;
      margin-bottom: 15px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 22px;
    }

    .card-resumo {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 13px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .card-resumo .numero {
      font-size: 20px;
      font-weight: 900;
      color: #dc6572;
      line-height: 1;
    }

    .card-resumo .texto {
      font-size: 9px;
      font-weight: 800;
      color: #cf6973;
      line-height: 1;
      white-space: nowrap;
    }

    .secao-titulo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 12px;
    }

    .secao-titulo h2 {
      font-size: 14px;
      color: #e15f70;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .linha {
      flex: 1;
      height: 1px;
      background: #eadada;
    }

    .casal-card {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 16px;
      padding: 14px 15px;
      margin-bottom: 11px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .linha-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: #f8e9ea;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d85f6f;
      font-weight: 900;
      font-size: 17px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .nome {
      font-size: 14px;
      font-weight: 900;
      color: #2f2423;
      margin-bottom: 3px;
    }

    .sub {
      font-size: 11px;
      color: #8b6f6c;
      line-height: 1.3;
    }

    .tag {
      background: #fde8e9;
      color: #a35d61;
      font-size: 10px;
      font-weight: 900;
      padding: 7px 8px;
      border-radius: 9px;
      white-space: nowrap;
    }

    .seta {
      color: #b98286;
      font-size: 22px;
      font-weight: 300;
    }

    .empty {
      font-size: 12px;
      color: #8b6f6c;
      text-align: center;
      margin-top: 28px;
      font-weight: 700;
      line-height: 1.35;
    }


    .barra-alertas {
      background: #fff7f7;
      border: 1px solid #eadada;
      border-radius: 16px;
      padding: 12px;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
    }

    .barra-alertas.hidden {
      display: none;
    }

    .barra-alertas-texto {
      font-size: 11px;
      color: #6f5552;
      font-weight: 800;
      line-height: 1.35;
    }

    .barra-alertas button {
      border: none;
      background: #d85f6f;
      color: #fff;
      padding: 9px 10px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .contador-notificacoes {
      position: absolute;
      top: 72px;
      right: 20px;
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #d85f6f;
      color: #fff;
      border: 2px solid #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      z-index: 30;
      box-shadow: 0 8px 18px rgba(0,0,0,0.16);
    }

    .contador-notificacoes.visivel {
      display: flex;
    }

    .notificacao-overlay {
      position: fixed;
      inset: 0;
      background: rgba(47,36,35,0.42);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .notificacao-overlay.hidden {
      display: none;
    }

    .notificacao-card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.28);
      border: 1px solid #eadada;
    }

    .notificacao-kicker {
      font-size: 12px;
      color: #d85f6f;
      font-weight: 900;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .notificacao-titulo {
      font-size: 18px;
      font-weight: 900;
      color: #2f2423;
      margin-bottom: 6px;
    }

    .notificacao-meta {
      font-size: 12px;
      color: #8b6f6c;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .notificacao-mensagem {
      background: #fff7f7;
      border: 1px solid #eadada;
      border-radius: 15px;
      padding: 12px;
      font-size: 12px;
      color: #4a2f2d;
      line-height: 1.45;
      margin-bottom: 14px;
      max-height: 110px;
      overflow: auto;
    }

    .notificacao-acoes {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }

    .notificacao-acoes button {
      border: none;
      border-radius: 14px;
      padding: 13px 12px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-whatsapp {
      background: #21a565;
      color: #fff;
    }

    .btn-crm {
      background: #f8e9ea;
      color: #a35d61;
    }

    .btn-fechar {
      background: transparent;
      color: #8b6f6c;
      padding: 9px 12px !important;
    }


    @media (min-width: 700px) {
      body {
        padding: 20px 0;
      }

      .phone-frame {
        min-height: calc(100vh - 40px);
        border-radius: 34px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      }
    }
  </style>
</head>

<body>
  <div class="phone-frame">
    <div id="contadorNotificacoes" class="contador-notificacoes">0</div>

    <div id="notificacaoOverlay" class="notificacao-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="notificacaoTitulo">
      <div class="notificacao-card">
        <div class="notificacao-kicker">🔔 NOVO LEAD</div>
        <div id="notificacaoTitulo" class="notificacao-titulo">Nova noiva para atendimento</div>
        <div id="notificacaoMeta" class="notificacao-meta">Origem não informada</div>
        <div id="notificacaoMensagem" class="notificacao-mensagem">Mensagem inicial não informada.</div>
        <div class="notificacao-acoes">
          <button type="button" class="btn-whatsapp" onclick="atenderNotificacaoWhatsApp()">Atender no WhatsApp</button>
          <button type="button" class="btn-crm" onclick="abrirNotificacaoNoCRM()">Ver ficha no CRM</button>
          <button type="button" class="btn-fechar" onclick="fecharPopupNotificacao()">Agora não</button>
        </div>
      </div>
    </div>

    <main class="app">
      <header>
        <div class="top-bar">
          <button type="button" class="menu-icon" onclick="window.location.href='menu.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '')" aria-label="Abrir menu">☰</button>

          <div class="logo">
            <div class="logo-small">ESPAÇO</div>
            <div class="logo-main">MARGÔ</div>
          </div>

          <button type="button" class="usuario-topo" onclick="window.location.href='perfil.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '')" aria-label="Abrir perfil">
            <span class="usuario-foto-topo" id="fotoUsuarioTopo">?</span>
          </button>
        </div>

        <div id="menuOpcoes" class="menu-opcoes hidden">
          <button type="button" class="menu-opcao" onclick="irParaMenuPrincipal()">☰ Menu</button>
          <button type="button" class="menu-opcao" onclick="abrirPerfil()">👤 Perfil</button>
        </div>

        <div class="saudacao" id="saudacao">Bom dia ☀️</div>
        <div class="frase" id="fraseMotivacional">Vamos encantar noivas hoje?</div>
      </header>

        <div id="barraAlertas" class="barra-alertas hidden">
          <div class="barra-alertas-texto">
            🔔 Ative os alertas para ser avisada quando uma nova noiva chegar.
          </div>
          <button type="button" onclick="ativarAlertasCRM()">Ativar</button>
        </div>

      <section class="cards-resumo">
        <div class="card-resumo" onclick="irParaSecao('novos')">
          <div class="numero" id="totalNovos">0</div>
          <div class="texto">Novos</div>
        </div>

        <div class="card-resumo" onclick="abrirOportunidades()">
          <div class="numero" id="totalOportunidades">0</div>
          <div class="texto">Oportunidades</div>
        </div>

        <div class="card-resumo" onclick="alert('Tela Resultados será ativada em breve.')">
          <div class="numero">0</div>
          <div class="texto">Resultados</div>
        </div>
      </section>

      <section id="novos">
        <div class="secao-titulo">
          <h2>📥 NOVOS CASAIS</h2>
          <div class="linha"></div>
        </div>

        <div id="listaCasais">
          <div class="empty">Carregando novos casais...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_CASAIS = "https://n8n.espacomargo.com.br/webhook/crm/casais";
    const API_USUARIOS = "https://n8n.espacomargo.com.br/webhook/crm/listar-usuarios";
    const API_USUARIOS_ALTERNATIVO = "https://n8n.espacomargo.com.br/webhook/crm/usuarios";
    const API_OPORTUNIDADES = "https://n8n.espacomargo.com.br/webhook/crm/oportunidades";
    const API_INICIAR_ATENDIMENTO = "https://n8n.espacomargo.com.br/webhook/crm/iniciar-atendimento";
    const API_VALIDAR_USUARIO = "https://n8n.espacomargo.com.br/webhook/crm/validar-usuario";
    const API_NOTIFICACOES_CHO = "https://n8n.espacomargo.com.br/webhook/crm/notificacoes-cho";
    const API_MARCAR_NOTIFICACAO_CHO = "https://n8n.espacomargo.com.br/webhook/crm/notificacoes-cho/marcar";

    function limpar(valor) {
      return String(valor || "").trim();
    }

    let usuarioAtualId = pegarUsuarioIdDaUrl();
    let usuarioAtual = null;

    const frases = [
      "Vamos encantar noivas hoje?",
      "Cada casal merece sentir que é único.",
      "Encantar é ouvir antes de apresentar.",
      "Hoje alguém pode encontrar o lugar dos sonhos.",
      "Uma visita pode mudar toda uma história.",
      "Cuidado transforma conversa em confiança.",
      "O amor já existe. Nós ajudamos a celebrar."
    ];

    const fraseEscolhida = frases[Math.floor(Math.random() * frases.length)];
    document.getElementById("fraseMotivacional").textContent = fraseEscolhida;

    function pegarUsuarioIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      const usuarioUrl = limpar(params.get("usuario_id"));
      const sessao = lerSessao();
      const usuarioSessao = limpar(sessao && sessao.usuario_id);
      const usuarioLocal = limpar(localStorage.getItem("margo_usuario_id"));

      return usuarioUrl || usuarioSessao || usuarioLocal || "";
    }

    function garantirSessaoObrigatoria() {
      const sessao = lerSessao();
      const usuarioSessao = limpar(sessao && sessao.usuario_id);

      if (!usuarioSessao) {
        localStorage.removeItem("margo_usuario");
        localStorage.removeItem("margo_usuario_id");
        window.location.replace("login.html");
        return false;
      }

      return true;
    }

    function queryUsuario() {
      if (!usuarioAtualId) return "";
      return "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function abrirMenuOpcoes() {
      window.location.href = 'menu.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '');
    }

    function fecharMenuOpcoes() {
      const menu = document.getElementById("menuOpcoes");
      if (!menu) return;
      menu.classList.add("hidden");
    }

    function abrirPerfil() {
      window.location.href = 'perfil.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '');
    }

    function irParaMenuPrincipal() {
      window.location.href = 'menu.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '');
    }

    function montarUrlAtendimento(casalId) {
      let url = "atendimento.html";

      if (casalId) {
        url += "?casal_id=" + encodeURIComponent(casalId);
        if (usuarioAtualId) {
          url += "&usuario_id=" + encodeURIComponent(usuarioAtualId);
        }
      } else if (usuarioAtualId) {
        url += "?usuario_id=" + encodeURIComponent(usuarioAtualId);
      }

      return url;
    }

    async function abrirAtendimento(casalId) {
      if (!casalId) {
        window.location.href = montarUrlAtendimento(casalId);
        return;
      }

      if (!usuarioAtualId) {
        alert("Usuário da consultora não identificado. Abra a Home com ?usuario_id=CHO_01 ou ?usuario_id=CHO_02.");
        window.location.href = montarUrlAtendimento(casalId);
        return;
      }

      try {
        await fetch(API_INICIAR_ATENDIMENTO, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            casal_id: casalId,
            usuario_id: usuarioAtualId
          })
        });
      } catch (erro) {
        console.error("Erro ao iniciar atendimento:", erro);
        alert("O atendimento será aberto, mas não foi possível atualizar o status automaticamente agora.");
      }

      window.location.href = montarUrlAtendimento(casalId);
    }

    function abrirOportunidades() {
      const query = queryUsuario();
      window.location.href = query ? "oportunidades.html?" + query : "oportunidades.html";
    }

    function irParaSecao(id) {
      document.getElementById(id).scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function primeiraLetra(nome) {
      if (!nome) return "?";
      return nome.trim().charAt(0).toUpperCase();
    }

    function nomeCasal(casal) {
      const noiva = casal.nome_noiva || "";
      const noivo = casal.nome_noivo || "";

      if (noiva && noivo) {
        return noiva + " e " + noivo;
      }

      return noiva || noivo || "Casal sem nome";
    }

    function formatarSubtitulo(casal) {
      const origem = casal.origem || "Origem não informada";
      const entrada = casal.data_entrada ? "Entrou em " + casal.data_entrada : "Entrada não informada";
      return entrada + " · " + origem;
    }

    function normalizarStatus(status) {
      return String(status || "").trim().toUpperCase().replace(/\s+/g, "_");
    }

    function limparConsultora(valor) {
      return String(valor || "")
        .replace(/consultora_responsavel\s*=\s*/gi, "")
        .trim();
    }

    function pertenceAoUsuario(casal) {
      if (!usuarioAtualId) return true;
      const consultoraCasal = limparConsultora(casal.consultora_responsavel);
      const usuarioAtual = limparConsultora(usuarioAtualId);
      return consultoraCasal === usuarioAtual;
    }

    function filtrarCasaisDaCHO(casais) {
      return casais.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return status === "NOVO" && pertenceAoUsuario(casal);
      });
    }

    function contarOportunidadesDaCHO(retornoOportunidades) {
      const agendar = retornoOportunidades.agendar || [];
      const resgatar = retornoOportunidades.resgatar || [];
      const todos = [...agendar, ...resgatar];

      const mapa = new Map();

      todos.forEach(casal => {
        if (casal && casal.casal_id && pertenceAoUsuario(casal)) {
          mapa.set(casal.casal_id, casal);
        }
      });

      return Array.from(mapa.values()).filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return (
          status === "NOVO" ||
          status === "EM_ATENDIMENTO" ||
          status === "VISITOU_NAO_FECHOU"
        );
      }).length;
    }

    function renderizarCasais(casaisNovos, totalOportunidades) {
      const lista = document.getElementById("listaCasais");
      const totalNovos = document.getElementById("totalNovos");
      const totalOportunidadesEl = document.getElementById("totalOportunidades");

      lista.innerHTML = "";
      totalOportunidadesEl.textContent = totalOportunidades;

      if (!casaisNovos || casaisNovos.length === 0) {
        totalNovos.textContent = "0";
        lista.innerHTML = '<div class="empty">Nenhum novo casal para esta consultora no momento.</div>';
        return;
      }

      totalNovos.textContent = casaisNovos.length;

      casaisNovos.forEach(casal => {
        const card = document.createElement("div");
        card.className = "casal-card";
        card.onclick = () => abrirAtendimento(casal.casal_id);

        card.innerHTML = `
          <div class="linha-card">
            <div class="avatar">${primeiraLetra(casal.nome_noiva)}</div>

            <div class="info">
              <div class="nome">${nomeCasal(casal)}</div>
              <div class="sub">${formatarSubtitulo(casal)}</div>
            </div>

            <div class="tag">Novo</div>
            <div class="seta">›</div>
          </div>
        `;

        lista.appendChild(card);
      });
    }

    function lerSessao() {
      try {
        return JSON.parse(localStorage.getItem("margo_usuario") || "null");
      } catch (erro) {
        return null;
      }
    }

    function periodoDia() {
      const hora = new Date().getHours();
      if (hora >= 12 && hora < 18) return "Boa tarde";
      if (hora >= 18 || hora < 5) return "Boa noite";
      return "Bom dia";
    }

    function nomeUsuarioSessao() {
      const sessao = lerSessao();
      return String((sessao && sessao.nome_usuario) || "").trim();
    }

    function iniciaisUsuario(usuario) {
      const nome = limpar((usuario && (usuario.nome_usuario || usuario.nome)) || "");

      if (!nome) return "?";

      const partes = nome.split(/\s+/).filter(Boolean);
      const primeira = partes[0] ? partes[0].charAt(0) : "";
      const segunda = partes.length > 1 ? partes[partes.length - 1].charAt(0) : "";

      return (primeira + segunda).toUpperCase() || "?";
    }

    function aplicarFotoUsuarioTopo(usuario) {
      const container = document.getElementById("fotoUsuarioTopo");
      if (!container) return;

      const fotoUrl = limpar(usuario && usuario.foto_url);
      const iniciais = iniciaisUsuario(usuario);

      container.innerHTML = "";

      if (!fotoUrl) {
        container.textContent = iniciais;
        return;
      }

      const imagem = document.createElement("img");
      imagem.src = fotoUrl;
      imagem.alt = "Foto do usuário";
      imagem.onerror = function () {
        container.innerHTML = "";
        container.textContent = iniciais;
      };

      container.appendChild(imagem);
    }

    function abrirMenu() {
      irParaMenuPrincipal();
    }


    document.addEventListener("click", function(event) {
      const menu = document.getElementById("menuOpcoes");
      const botao = document.querySelector(".menu-icon");
      if (!menu || menu.classList.contains("hidden")) return;
      if (menu.contains(event.target) || botao.contains(event.target)) return;
      fecharMenuOpcoes();
    });

    function extrairListaUsuarios(dados) {
      if (Array.isArray(dados)) return dados;
      if (dados && Array.isArray(dados.usuarios)) return dados.usuarios;
      if (dados && Array.isArray(dados.data)) return dados.data;
      if (dados && dados.usuario_id) return [dados];
      return [];
    }

    function extrairListaCasais(dados) {
      if (Array.isArray(dados)) return dados;
      if (dados && Array.isArray(dados.casais)) return dados.casais;
      if (dados && Array.isArray(dados.data)) return dados.data;
      if (dados && Array.isArray(dados.items)) return dados.items;
      if (dados && dados.casal_id) return [dados];
      return [];
    }

    async function fetchJsonComTimeout(url, timeoutMs = 9000) {
      const controlador = new AbortController();
      const timer = setTimeout(() => controlador.abort(), timeoutMs);

      try {
        const resposta = await fetch(url, {
          cache: "no-store",
          signal: controlador.signal
        });

        if (!resposta.ok) {
          throw new Error("HTTP " + resposta.status + " ao buscar " + url);
        }

        return await resposta.json();
      } finally {
        clearTimeout(timer);
      }
    }

    function campoPreenchido(valor) {
      return limpar(valor) !== "";
    }

    function combinarUsuarios(base, extra) {
      const combinado = Object.assign({}, base || {});

      Object.keys(extra || {}).forEach(chave => {
        if (!campoPreenchido(combinado[chave]) && campoPreenchido(extra[chave])) {
          combinado[chave] = extra[chave];
        }
      });

      return combinado;
    }

    async function buscarUsuarioLista() {
      const urls = [API_USUARIOS, API_USUARIOS_ALTERNATIVO].filter(Boolean);

      for (const url of urls) {
        try {
          const dados = await fetchJsonComTimeout(url + "?t=" + Date.now(), 7000);
          const usuarios = extrairListaUsuarios(dados);
          const encontrado = usuarios.find(usuario => {
            return String(usuario.usuario_id || "").trim() === String(usuarioAtualId).trim();
          }) || null;

          if (encontrado) return encontrado;
        } catch (erro) {
          console.warn("Erro ao buscar usuário na lista:", url, erro);
        }
      }

      return null;
    }

    async function buscarUsuarioValidado() {
      try {
        const sessao = lerSessao();
        const senhaAcesso = limpar(sessao && sessao.senha_acesso);
        if (!usuarioAtualId || !senhaAcesso) return null;

        const resposta = await fetch(API_VALIDAR_USUARIO, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usuario_id: usuarioAtualId,
            senha_acesso: senhaAcesso
          })
        });

        const dados = await resposta.json();
        if (!dados || dados.autorizado !== true) return null;
        return dados;
      } catch (erro) {
        console.warn("Erro ao validar usuário para carregar foto:", erro);
        return null;
      }
    }

    async function carregarUsuario() {
      const sessao = lerSessao();
      const nomeSessao = limpar(sessao && sessao.nome_usuario);

      if (sessao) {
        aplicarFotoUsuarioTopo(sessao);
      }

      if (!usuarioAtualId) {
        document.getElementById("saudacao").textContent = periodoDia() + " ☀️";
        return;
      }

      try {
        const usuarioLista = await buscarUsuarioLista();
        const usuarioValidado = await buscarUsuarioValidado();
        usuarioAtual = combinarUsuarios(combinarUsuarios(sessao, usuarioLista), usuarioValidado);

        if (usuarioAtual) {
          aplicarFotoUsuarioTopo(usuarioAtual);
        }

        const nome = limpar((usuarioAtual && (usuarioAtual.nome_usuario || usuarioAtual.nome)) || nomeSessao);

        if (nome) {
          document.getElementById("saudacao").textContent = periodoDia() + ", " + nome + " ☀️";
        } else {
          document.getElementById("saudacao").textContent = periodoDia() + " ☀️";
        }

      } catch (erro) {
        console.error("Erro ao carregar usuário:", erro);

        if (nomeSessao) {
          document.getElementById("saudacao").textContent = periodoDia() + ", " + nomeSessao + " ☀️";
        } else {
          document.getElementById("saudacao").textContent = periodoDia() + " ☀️";
        }
      }
    }


    function getIdsNotificacoesExibidas() {
      try {
        const lista = JSON.parse(localStorage.getItem("margo_notificacoes_exibidas") || "[]");
        return Array.isArray(lista) ? lista : [];
      } catch (erro) {
        return [];
      }
    }

    function salvarIdNotificacaoExibida(id) {
      if (!id) return;
      const lista = getIdsNotificacoesExibidas().filter(Boolean);
      if (!lista.includes(id)) lista.unshift(id);
      localStorage.setItem("margo_notificacoes_exibidas", JSON.stringify(lista.slice(0, 80)));
    }

    function extrairListaNotificacoes(dados) {
      if (Array.isArray(dados)) return dados;
      if (dados && Array.isArray(dados.notificacoes)) return dados.notificacoes;
      if (dados && Array.isArray(dados.data)) return dados.data;
      if (dados && Array.isArray(dados.items)) return dados.items;
      if (dados && dados.notificacao_id) return [dados];
      return [];
    }

    function statusNotificacao(notificacao) {
      return String((notificacao && notificacao.status_notificacao) || "").trim().toUpperCase();
    }

    function idNotificacao(notificacao) {
      return limpar(notificacao && (notificacao.notificacao_id || notificacao.id || notificacao.casal_id));
    }

    function primeiroNome(nome) {
      const partes = String(nome || "").trim().split(/\s+/).filter(Boolean);
      return partes[0] || "tudo bem";
    }

    function normalizarTelefoneWhatsApp(telefone) {
      let digitos = String(telefone || "").replace(/\D/g, "");

      if (!digitos) return "";

      if (digitos.startsWith("55") && digitos.length >= 12) {
        return digitos;
      }

      if (digitos.length === 11 || digitos.length === 10) {
        return "55" + digitos;
      }

      return digitos;
    }

    function removerTextoDoLinkWhatsApp(link) {
      const texto = limpar(link);
      if (!texto) return "";

      try {
        const url = new URL(texto);
        url.searchParams.delete("text");
        return url.toString();
      } catch (erro) {
        return texto.split("?text=")[0];
      }
    }

    function montarLinkWhatsAppNotificacao(notificacao) {
      const linkPronto = limpar(notificacao && notificacao.link_whatsapp);
      if (linkPronto) return removerTextoDoLinkWhatsApp(linkPronto);

      const telefone = normalizarTelefoneWhatsApp(notificacao && (notificacao.telefone_noiva || notificacao.telefone || notificacao.whatsapp));
      if (!telefone) return "";

      // Abre apenas a conversa. A CHO escreve com a própria voz, sem texto pronto.
      return "https://wa.me/" + telefone;
    }

    let notificacaoAtual = null;
    let verificacaoNotificacoesTimer = null;
    let audioContextoCRM = null;

    function mostrarBarraAlertasSeNecessario() {
      const barra = document.getElementById("barraAlertas");
      if (!barra) return;

      const alertasAtivos = localStorage.getItem("margo_alertas_ativos") === "SIM";
      const notificacoesOk = !("Notification" in window) || Notification.permission === "granted";

      if (alertasAtivos && notificacoesOk) {
        barra.classList.add("hidden");
      } else {
        barra.classList.remove("hidden");
      }
    }

    async function ativarAlertasCRM() {
      localStorage.setItem("margo_alertas_ativos", "SIM");

      try {
        tocarAlertaNovoLead(true);
      } catch (erro) {
        console.warn("Não foi possível testar o som de alerta:", erro);
      }

      if ("Notification" in window && Notification.permission === "default") {
        try {
          await Notification.requestPermission();
        } catch (erro) {
          console.warn("Não foi possível solicitar permissão de notificação:", erro);
        }
      }

      mostrarBarraAlertasSeNecessario();
      alert("Alertas ativados. Deixe o CRM aberto ou minimizado para receber avisos de novos leads.");
    }

    function tocarAlertaNovoLead(teste) {
      if (!teste && localStorage.getItem("margo_alertas_ativos") !== "SIM") return;

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      if (!audioContextoCRM) {
        audioContextoCRM = new AudioContext();
      }

      if (audioContextoCRM.state === "suspended") {
        audioContextoCRM.resume();
      }

      const agora = audioContextoCRM.currentTime;
      const frequencias = [880, 1046, 1318];

      frequencias.forEach((freq, index) => {
        const oscilador = audioContextoCRM.createOscillator();
        const ganho = audioContextoCRM.createGain();

        oscilador.type = "sine";
        oscilador.frequency.setValueAtTime(freq, agora + index * 0.16);

        ganho.gain.setValueAtTime(0.0001, agora + index * 0.16);
        ganho.gain.exponentialRampToValueAtTime(0.22, agora + index * 0.16 + 0.03);
        ganho.gain.exponentialRampToValueAtTime(0.0001, agora + index * 0.16 + 0.13);

        oscilador.connect(ganho);
        ganho.connect(audioContextoCRM.destination);

        oscilador.start(agora + index * 0.16);
        oscilador.stop(agora + index * 0.16 + 0.14);
      });
    }

    function mostrarNotificacaoSistema(notificacao) {
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;

      const nome = limpar(notificacao && notificacao.nome_noiva) || "Nova noiva";
      const origem = limpar(notificacao && notificacao.origem) || "Origem não informada";

      try {
        const aviso = new Notification("Novo lead Espaço Margô", {
          body: nome + " · " + origem,
          icon: "icons/icon-192.png",
          badge: "icons/icon-192.png",
          tag: idNotificacao(notificacao) || "novo-lead-margo"
        });

        aviso.onclick = function () {
          window.focus();
          mostrarPopupNotificacao(notificacao);
          aviso.close();
        };
      } catch (erro) {
        console.warn("Não foi possível mostrar notificação do sistema:", erro);
      }
    }

    function atualizarContadorNotificacoes(total) {
      const contador = document.getElementById("contadorNotificacoes");
      if (!contador) return;

      const numero = Number(total || 0);

      if (numero > 0) {
        contador.textContent = numero > 9 ? "9+" : String(numero);
        contador.classList.add("visivel");
      } else {
        contador.textContent = "0";
        contador.classList.remove("visivel");
      }
    }

    function mostrarPopupNotificacao(notificacao) {
      notificacaoAtual = notificacao;

      const nome = limpar(notificacao && notificacao.nome_noiva) || "Nova noiva";
      const origem = limpar(notificacao && notificacao.origem) || "Origem não informada";
      const telefone = limpar(notificacao && (notificacao.telefone_noiva || notificacao.telefone || notificacao.whatsapp)) || "Telefone não informado";
      const mensagem = limpar(notificacao && notificacao.mensagem_inicial) || "Mensagem inicial não informada.";

      document.getElementById("notificacaoTitulo").textContent = nome;
      document.getElementById("notificacaoMeta").textContent = origem + " · " + telefone;
      document.getElementById("notificacaoMensagem").textContent = mensagem;

      const overlay = document.getElementById("notificacaoOverlay");
      if (overlay) overlay.classList.remove("hidden");
    }

    function fecharPopupNotificacao() {
      const overlay = document.getElementById("notificacaoOverlay");
      if (overlay) overlay.classList.add("hidden");
    }

    async function marcarNotificacaoCHO(notificacao, status) {
      const notificacaoId = idNotificacao(notificacao);
      if (!notificacaoId && !(notificacao && notificacao.casal_id)) return;

      try {
        await fetch(API_MARCAR_NOTIFICACAO_CHO, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            notificacao_id: notificacaoId,
            casal_id: notificacao && notificacao.casal_id,
            usuario_id: usuarioAtualId,
            consultora_responsavel: usuarioAtualId,
            status_notificacao: status,
            data_evento: new Date().toISOString()
          })
        });
      } catch (erro) {
        console.warn("Não foi possível marcar notificação:", erro);
      }
    }

    async function atenderNotificacaoWhatsApp() {
      if (!notificacaoAtual) return;

      const link = montarLinkWhatsAppNotificacao(notificacaoAtual);

      if (!link) {
        alert("Não encontrei telefone/link de WhatsApp para esta noiva.");
        return;
      }

      await marcarNotificacaoCHO(notificacaoAtual, "ATENDIDA");
      fecharPopupNotificacao();
      window.open(link, "_blank", "noopener,noreferrer");
    }

    async function abrirNotificacaoNoCRM() {
      if (!notificacaoAtual) return;

      await marcarNotificacaoCHO(notificacaoAtual, "VISUALIZADA");
      fecharPopupNotificacao();

      const casalId = notificacaoAtual.casal_id;
      if (casalId) {
        window.location.href = montarUrlAtendimento(casalId);
      }
    }

    async function verificarNotificacoesCHO() {
      if (!usuarioAtualId) return;

      try {
        const url = API_NOTIFICACOES_CHO + "?" + queryUsuario() + "&status=NOVA&t=" + Date.now();
        const dados = await fetchJsonComTimeout(url, 7000);
        const notificacoes = extrairListaNotificacoes(dados).filter(notificacao => {
          const consultora = limparConsultora(notificacao.consultora_responsavel || notificacao.usuario_id);
          const pertence = !consultora || consultora === limparConsultora(usuarioAtualId);
          const status = statusNotificacao(notificacao);
          return pertence && (!status || status === "NOVA");
        });

        atualizarContadorNotificacoes(notificacoes.length);

        const jaExibidas = getIdsNotificacoesExibidas();
        const nova = notificacoes.find(notificacao => {
          const id = idNotificacao(notificacao);
          return id && !jaExibidas.includes(id);
        }) || null;

        if (!nova) return;

        salvarIdNotificacaoExibida(idNotificacao(nova));
        tocarAlertaNovoLead(false);
        mostrarPopupNotificacao(nova);
        mostrarNotificacaoSistema(nova);

      } catch (erro) {
        console.warn("Não foi possível verificar notificações da CHO:", erro);
      }
    }

    function iniciarMonitorDeNotificacoes() {
      mostrarBarraAlertasSeNecessario();
      verificarNotificacoesCHO();

      if (verificacaoNotificacoesTimer) {
        clearInterval(verificacaoNotificacoesTimer);
      }

      verificacaoNotificacoesTimer = setInterval(verificarNotificacoesCHO, 30000);
    }

    function registrarServiceWorkerPWA() {
      if (!("serviceWorker" in navigator)) return;

      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function (erro) {
          console.warn("Service Worker não registrado:", erro);
        });
      });
    }


    async function carregarCasais() {
      const lista = document.getElementById("listaCasais");
      const totalNovos = document.getElementById("totalNovos");
      const totalOportunidadesEl = document.getElementById("totalOportunidades");

      try {
        const dadosCasais = await fetchJsonComTimeout(API_CASAIS + "?t=" + Date.now(), 9000);
        const casais = extrairListaCasais(dadosCasais);
        const casaisNovos = filtrarCasaisDaCHO(casais);

        let totalOportunidades = 0;
        try {
          const dadosOportunidades = await fetchJsonComTimeout(API_OPORTUNIDADES + "?t=" + Date.now(), 7000);
          totalOportunidades = contarOportunidadesDaCHO(dadosOportunidades);
        } catch (erroOportunidades) {
          console.warn("Não foi possível carregar oportunidades. Novos casais serão exibidos mesmo assim.", erroOportunidades);
        }

        console.log("Home CHO", {
          usuarioAtualId,
          totalCasaisRecebidos: casais.length,
          totalNovosDaCHO: casaisNovos.length,
          casaisNovos
        });

        renderizarCasais(casaisNovos, totalOportunidades);

      } catch (erro) {
        console.error("Erro ao carregar casais:", erro);

        lista.innerHTML =
          '<div class="empty">Não foi possível carregar os casais agora.<br>Atualize a página ou confira o endpoint /crm/casais.</div>';

        totalNovos.textContent = "0";
        totalOportunidadesEl.textContent = "0";
      }
    }

    async function iniciarHome() {
      await carregarUsuario();
      await carregarCasais();
      iniciarMonitorDeNotificacoes();

      setTimeout(carregarCasais, 2500);
    }

    window.addEventListener("pageshow", function () {
      if (garantirSessaoObrigatoria()) {
        carregarCasais();
      }
    });

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && garantirSessaoObrigatoria()) {
        carregarCasais();
        verificarNotificacoesCHO();
      }
    });

    registrarServiceWorkerPWA();

    if (garantirSessaoObrigatoria()) {
      iniciarHome();
    }
  </script>
