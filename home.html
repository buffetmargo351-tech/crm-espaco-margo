<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Espaço Margô - Home Office</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f4f0ef;
      color: #2f2423;
      min-height: 100vh;
    }

    .phone-frame {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .app {
      padding: 24px 22px 28px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .menu-icon {
      font-size: 25px;
      color: #4a2f2d;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .usuario-topo {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      border: 1px solid #eadada;
      background: #fff7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
      box-shadow: 0 6px 14px rgba(0,0,0,0.05);
    }

    .usuario-foto-topo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d85f6f;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .usuario-foto-topo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo {
      text-align: center;
      color: #b98286;
      line-height: 1.1;
    }

    .menu-opcoes {
      position: absolute;
      top: 62px;
      left: 22px;
      width: 190px;
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 16px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.14);
      padding: 8px;
      z-index: 20;
    }

    .menu-opcoes.hidden {
      display: none;
    }

    .menu-opcao {
      width: 100%;
      border: none;
      background: transparent;
      color: #4a2f2d;
      font-size: 13px;
      font-weight: 800;
      padding: 11px 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: left;
    }

    .menu-opcao:hover {
      background: #fbf0f1;
      color: #c45668;
    }


    .logo-small {
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 500;
    }

    .logo-main {
      font-size: 29px;
      letter-spacing: 2px;
      font-family: Georgia, serif;
    }

    .saudacao {
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 4px;
    }

    .frase {
      font-size: 12px;
      color: #8b6f6c;
      margin-bottom: 15px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 22px;
    }

    .card-resumo {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 13px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .card-resumo .numero {
      font-size: 20px;
      font-weight: 900;
      color: #dc6572;
      line-height: 1;
    }

    .card-resumo .texto {
      font-size: 9px;
      font-weight: 800;
      color: #cf6973;
      line-height: 1;
      white-space: nowrap;
    }

    .secao-titulo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 12px;
    }

    .secao-titulo h2 {
      font-size: 14px;
      color: #e15f70;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .linha {
      flex: 1;
      height: 1px;
      background: #eadada;
    }

    .casal-card {
      background: #ffffff;
      border: 1px solid #eadada;
      border-radius: 16px;
      padding: 14px 15px;
      margin-bottom: 11px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .linha-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: #f8e9ea;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d85f6f;
      font-weight: 900;
      font-size: 17px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .nome {
      font-size: 14px;
      font-weight: 900;
      color: #2f2423;
      margin-bottom: 3px;
    }

    .telefone-card {
      font-size: 12px;
      color: #6f5552;
      font-weight: 850;
      line-height: 1.25;
      margin-bottom: 3px;
      letter-spacing: 0.1px;
    }

    .sub {
      font-size: 11px;
      color: #8b6f6c;
      line-height: 1.3;
    }

    .tag {
      background: #fde8e9;
      color: #a35d61;
      font-size: 10px;
      font-weight: 900;
      padding: 7px 8px;
      border-radius: 9px;
      white-space: nowrap;
    }

    .seta {
      color: #b98286;
      font-size: 22px;
      font-weight: 300;
    }

    .empty {
      font-size: 12px;
      color: #8b6f6c;
      text-align: center;
      margin-top: 28px;
      font-weight: 700;
      line-height: 1.35;
    }


    /* ===== FILA DE REVISÃO DA MILENE ===== */
    .milene-review-section {
      display: none;
      margin: -8px 0 18px;
      border: 1px solid #e4c9c3;
      border-radius: 16px;
      background: #fff8f5;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    .milene-review-section.show {
      display: block;
    }

    .milene-review-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px solid #ecd8d3;
    }

    .milene-review-title {
      color: #7a4b35;
      font-size: 12px;
      font-weight: 950;
    }

    .milene-review-count {
      min-width: 28px;
      height: 24px;
      padding: 0 7px;
      border-radius: 999px;
      background: #d95773;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 950;
    }

    .milene-review-count.urgent {
      background: #b33f35;
    }

    .milene-review-list {
      display: grid;
      gap: 1px;
    }

    .milene-review-card {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #f0ded9;
      background: #fffdfc;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
    }

    .milene-review-card:last-child {
      border-bottom: 0;
    }

    .milene-review-card.urgent {
      background: #fff1ee;
    }

    .milene-review-card-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }

    .milene-review-name {
      color: #4b3734;
      font-size: 11px;
      font-weight: 950;
    }

    .milene-review-action {
      color: #a35d61;
      font-size: 9px;
      font-weight: 900;
      white-space: nowrap;
    }

    .milene-review-message {
      color: #806966;
      font-size: 10px;
      line-height: 1.3;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    @media (min-width: 700px) {
      body {
        padding: 20px 0;
      }

      .phone-frame {
        min-height: calc(100vh - 40px);
        border-radius: 34px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      }
    }
  </style>
</head>

<body>
  <div class="phone-frame">
    <main class="app">
      <header>
        <div class="top-bar">
          <button type="button" class="menu-icon" onclick="window.location.href='menu.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '')" aria-label="Abrir menu">☰</button>

          <div class="logo">
            <div class="logo-small">ESPAÇO</div>
            <div class="logo-main">MARGÔ</div>
          </div>

          <button type="button" class="usuario-topo" onclick="window.location.href='perfil.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '')" aria-label="Abrir perfil">
            <span class="usuario-foto-topo" id="fotoUsuarioTopo">?</span>
          </button>
        </div>

        <div id="menuOpcoes" class="menu-opcoes hidden">
          <button type="button" class="menu-opcao" onclick="irParaMenuPrincipal()">☰ Menu</button>
          <button type="button" class="menu-opcao" onclick="abrirPerfil()">👤 Perfil</button>
        </div>

        <div class="saudacao" id="saudacao">Bom dia ☀️</div>
        <div class="frase" id="fraseMotivacional">Vamos encantar noivas hoje?</div>
      </header>

      <section class="cards-resumo">
        <div class="card-resumo" onclick="irParaSecao('novos')">
          <div class="numero" id="totalNovos">0</div>
          <div class="texto">Novos</div>
        </div>

        <div class="card-resumo" onclick="abrirOportunidades()">
          <div class="numero" id="totalOportunidades">0</div>
          <div class="texto">Oportunidades</div>
        </div>

        <div class="card-resumo" onclick="alert('Tela Resultados será ativada em breve.')">
          <div class="numero">0</div>
          <div class="texto">Resultados</div>
        </div>
      </section>


      <section class="milene-review-section" id="mileneReviewSection">
        <div class="milene-review-header">
          <div class="milene-review-title" id="mileneReviewTitle">MILENE • AGUARDANDO REVISÃO</div>
          <div class="milene-review-count" id="mileneReviewCount">0</div>
        </div>
        <div class="milene-review-list" id="mileneReviewList"></div>
      </section>

      <section id="novos">
        <div class="secao-titulo">
          <h2>📥 NOVOS CASAIS</h2>
          <div class="linha"></div>
        </div>

        <div id="listaCasais">
          <div class="empty">Carregando novos casais...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const API_CASAIS = "https://n8n.espacomargo.com.br/webhook/crm/casais";
    const API_USUARIOS = "https://n8n.espacomargo.com.br/webhook/crm/listar-usuarios";
    const API_USUARIOS_ALTERNATIVO = "https://n8n.espacomargo.com.br/webhook/crm/usuarios";
    const API_OPORTUNIDADES = "https://n8n.espacomargo.com.br/webhook/crm/oportunidades";
    const API_INICIAR_ATENDIMENTO = "https://n8n.espacomargo.com.br/webhook/crm/iniciar-atendimento";
    const API_VALIDAR_USUARIO = "https://n8n.espacomargo.com.br/webhook/crm/validar-usuario";
    const API_REVISOES_PENDENTES = "https://n8n.espacomargo.com.br/webhook/crm/revisoes-milene-pendentes";

    function limpar(valor) {
      return String(valor || "").trim();
    }

    let usuarioAtualId = pegarUsuarioIdDaUrl();
    let usuarioAtual = null;

    const frases = [
      "Vamos encantar noivas hoje?",
      "Cada casal merece sentir que é único.",
      "Encantar é ouvir antes de apresentar.",
      "Hoje alguém pode encontrar o lugar dos sonhos.",
      "Uma visita pode mudar toda uma história.",
      "Cuidado transforma conversa em confiança.",
      "O amor já existe. Nós ajudamos a celebrar."
    ];

    const fraseEscolhida = frases[Math.floor(Math.random() * frases.length)];
    document.getElementById("fraseMotivacional").textContent = fraseEscolhida;

    function pegarUsuarioIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      const usuarioUrl = limpar(params.get("usuario_id"));
      const sessao = lerSessao();
      const usuarioSessao = limpar(sessao && sessao.usuario_id);
      const usuarioLocal = limpar(localStorage.getItem("margo_usuario_id"));

      return usuarioUrl || usuarioSessao || usuarioLocal || "";
    }

    function garantirSessaoObrigatoria() {
      const sessao = lerSessao();
      const usuarioSessao = limpar(sessao && sessao.usuario_id);

      if (!usuarioSessao) {
        localStorage.removeItem("margo_usuario");
        localStorage.removeItem("margo_usuario_id");
        window.location.replace("login.html");
        return false;
      }

      return true;
    }

    function queryUsuario() {
      if (!usuarioAtualId) return "";
      return "usuario_id=" + encodeURIComponent(usuarioAtualId);
    }

    function abrirMenuOpcoes() {
      window.location.href = 'menu.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '');
    }

    function fecharMenuOpcoes() {
      const menu = document.getElementById("menuOpcoes");
      if (!menu) return;
      menu.classList.add("hidden");
    }

    function abrirPerfil() {
      window.location.href = 'perfil.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '');
    }

    function irParaMenuPrincipal() {
      window.location.href = 'menu.html' + (localStorage.getItem('margo_usuario_id') ? '?usuario_id=' + encodeURIComponent(localStorage.getItem('margo_usuario_id')) : '');
    }

    function montarUrlAtendimento(casalId) {
      let url = "atendimento.html";

      if (casalId) {
        url += "?casal_id=" + encodeURIComponent(casalId);
        if (usuarioAtualId) {
          url += "&usuario_id=" + encodeURIComponent(usuarioAtualId);
        }
      } else if (usuarioAtualId) {
        url += "?usuario_id=" + encodeURIComponent(usuarioAtualId);
      }

      return url;
    }

    async function abrirAtendimento(casalId) {
      if (!casalId) {
        window.location.href = montarUrlAtendimento(casalId);
        return;
      }

      if (!usuarioAtualId) {
        alert("Usuário da consultora não identificado. Abra a Home com ?usuario_id=CHO_01 ou ?usuario_id=CHO_02.");
        window.location.href = montarUrlAtendimento(casalId);
        return;
      }

      try {
        await fetch(API_INICIAR_ATENDIMENTO, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            casal_id: casalId,
            usuario_id: usuarioAtualId
          })
        });
      } catch (erro) {
        console.error("Erro ao iniciar atendimento:", erro);
        alert("O atendimento será aberto, mas não foi possível atualizar o status automaticamente agora.");
      }

      window.location.href = montarUrlAtendimento(casalId);
    }

    function abrirOportunidades() {
      const query = queryUsuario();
      window.location.href = query ? "oportunidades.html?" + query : "oportunidades.html";
    }

    function irParaSecao(id) {
      document.getElementById(id).scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    function primeiraLetra(nome) {
      if (!nome) return "?";
      return nome.trim().charAt(0).toUpperCase();
    }

    function nomeCasal(casal) {
      const pessoa1 = casal.nome_pessoa_1 || casal.nome_noiva || "";
      const pessoa2 = casal.nome_pessoa_2 || casal.nome_noivo || "";

      if (pessoa1 && pessoa2) {
        return pessoa1 + " e " + pessoa2;
      }

      return pessoa1 || pessoa2 || casal.nome_contato || "Casal sem nome";
    }

    function formatarTelefoneCard(valor) {
      let telefone = String(valor || "").replace(/\D/g, "");

      if ((telefone.length === 12 || telefone.length === 13) && telefone.startsWith("55")) {
        telefone = telefone.slice(2);
      }

      if (telefone.length === 11) {
        return "(" + telefone.slice(0, 2) + ") " + telefone.slice(2, 7) + "-" + telefone.slice(7);
      }

      if (telefone.length === 10) {
        return "(" + telefone.slice(0, 2) + ") " + telefone.slice(2, 6) + "-" + telefone.slice(6);
      }

      return telefone || "Telefone não informado";
    }

    function formatarSubtitulo(casal) {
      const origem = casal.origem || "Origem não informada";
      const entrada = casal.data_entrada ? "Entrou em " + casal.data_entrada : "Entrada não informada";
      return entrada + " · " + origem;
    }

    function normalizarStatus(status) {
      return String(status || "").trim().toUpperCase().replace(/\s+/g, "_");
    }

    function limparConsultora(valor) {
      return String(valor || "")
        .replace(/consultora_responsavel\s*=\s*/gi, "")
        .trim();
    }

    function pertenceAoUsuario(casal) {
      if (!usuarioAtualId) return true;
      const consultoraCasal = limparConsultora(casal.consultora_responsavel);
      const usuarioAtual = limparConsultora(usuarioAtualId);
      return consultoraCasal === usuarioAtual;
    }

    function filtrarCasaisDaCHO(casais) {
      return casais.filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return status === "NOVO" && pertenceAoUsuario(casal);
      });
    }

    function contarOportunidadesDaCHO(retornoOportunidades) {
      const agendar = retornoOportunidades.agendar || [];
      const resgatar = retornoOportunidades.resgatar || [];
      const todos = [...agendar, ...resgatar];

      const mapa = new Map();

      todos.forEach(casal => {
        if (casal && casal.casal_id && pertenceAoUsuario(casal)) {
          mapa.set(casal.casal_id, casal);
        }
      });

      return Array.from(mapa.values()).filter(casal => {
        const status = normalizarStatus(casal.status_casal);
        return (
          status === "NOVO" ||
          status === "EM_ATENDIMENTO" ||
          status === "VISITOU_NAO_FECHOU"
        );
      }).length;
    }

    function renderizarCasais(casaisNovos, totalOportunidades) {
      const lista = document.getElementById("listaCasais");
      const totalNovos = document.getElementById("totalNovos");
      const totalOportunidadesEl = document.getElementById("totalOportunidades");

      lista.innerHTML = "";
      totalOportunidadesEl.textContent = totalOportunidades;

      if (!casaisNovos || casaisNovos.length === 0) {
        totalNovos.textContent = "0";
        lista.innerHTML = '<div class="empty">Nenhum novo casal para esta consultora no momento.</div>';
        return;
      }

      totalNovos.textContent = casaisNovos.length;

      casaisNovos.forEach(casal => {
        const card = document.createElement("div");
        card.className = "casal-card";
        card.onclick = () => abrirAtendimento(casal.casal_id);

        card.innerHTML = `
          <div class="linha-card">
            <div class="avatar">${primeiraLetra(casal.nome_pessoa_1 || casal.nome_noiva || casal.nome_contato)}</div>

            <div class="info">
              <div class="nome">${nomeCasal(casal)}</div>
              <div class="telefone-card">📱 ${formatarTelefoneCard(casal.telefone || casal.telefone_noiva || casal.whatsapp)}</div>
              <div class="sub">${formatarSubtitulo(casal)}</div>
            </div>

            <div class="tag">Novo</div>
            <div class="seta">›</div>
          </div>
        `;

        lista.appendChild(card);
      });
    }


    let timerRevisoesMileneHome = null;
    let audioRevisoesHomeLiberado = false;

    document.addEventListener("pointerdown", function liberarSomHome() {
      audioRevisoesHomeLiberado = true;
    }, { once: true });

    function parseJsonSeguro(valor) {
      try { return JSON.parse(String(valor || "") || "{}"); }
      catch (_) { return {}; }
    }

    function usuarioEhAdmin() {
      const sessao = lerSessao();
      return String((usuarioAtual && usuarioAtual.tipo_usuario) || (sessao && sessao.tipo_usuario) || "")
        .trim()
        .toUpperCase() === "ADMIN";
    }

    function revisaoPertenceAoUsuario(revisao) {
      if (usuarioEhAdmin()) return true;
      if (!usuarioAtualId) return true;

      return limparConsultora(revisao.consultora_responsavel) === limparConsultora(usuarioAtualId);
    }

    function nomeCasalDaRevisao(revisao) {
      const contexto = parseJsonSeguro(revisao.dados_contexto_json);
      const nome = limpar(contexto.nome_casal);
      if (nome) return nome.replace(" & ", " e ");

      const pessoa1 = limpar(contexto.nome_pessoa_1);
      const pessoa2 = limpar(contexto.nome_pessoa_2);
      if (pessoa1 || pessoa2) return [pessoa1, pessoa2].filter(Boolean).join(" e ");

      return "Casal " + limpar(revisao.casal_id).replace("CASAL_", "");
    }

    function acaoVisualRevisao(valor) {
      const mapa = {
        RESPONDER: "Responder",
        GERAR_PROPOSTA: "Proposta",
        ENVIAR_PROPOSTA_EXISTENTE: "Proposta",
        CONFIRMAR_VISITA: "Visita",
        TRANSFERIR_HUMANO: "Precisa de ajuda"
      };
      const chave = String(valor || "RESPONDER").toUpperCase();
      return mapa[chave] || chave.replaceAll("_", " ");
    }

    function tocarSomRevisaoHome(prioridade) {
      if (!audioRevisoesHomeLiberado) return;

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const urgente = String(prioridade || "").toUpperCase() === "URGENTE";
        const frequencias = urgente ? [760, 930] : [710];

        frequencias.forEach((freq, indice) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const inicio = ctx.currentTime + indice * .16;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(.0001, inicio);
          gain.gain.exponentialRampToValueAtTime(.14, inicio + .015);
          gain.gain.exponentialRampToValueAtTime(.0001, inicio + .12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(inicio);
          osc.stop(inicio + .13);
        });

        setTimeout(() => ctx.close().catch(() => {}), 700);
      } catch (_) {}
    }

    function abrirRevisaoPendenteHome(casalId) {
      window.location.href = montarUrlAtendimento(casalId);
    }

    function renderizarRevisoesMileneHome(revisoes) {
      const section = document.getElementById("mileneReviewSection");
      const list = document.getElementById("mileneReviewList");
      const count = document.getElementById("mileneReviewCount");
      const title = document.getElementById("mileneReviewTitle");

      const filtradas = (Array.isArray(revisoes) ? revisoes : [])
        .filter(revisaoPertenceAoUsuario);

      if (!filtradas.length) {
        section.classList.remove("show");
        list.innerHTML = "";
        count.textContent = "0";
        return;
      }

      const urgentes = filtradas.filter(
        item => String(item.prioridade || "").toUpperCase() === "URGENTE"
      );

      section.classList.add("show");
      count.textContent = String(filtradas.length);
      count.classList.toggle("urgent", urgentes.length > 0);
      title.textContent = urgentes.length
        ? "MILENE PRECISA DE AJUDA"
        : "MILENE • AGUARDANDO REVISÃO";

      list.innerHTML = "";

      filtradas.slice(0, 6).forEach(revisao => {
        const urgente = String(revisao.prioridade || "").toUpperCase() === "URGENTE";
        const card = document.createElement("button");
        card.type = "button";
        card.className = "milene-review-card" + (urgente ? " urgent" : "");
        card.onclick = () => abrirRevisaoPendenteHome(revisao.casal_id);

        const nome = nomeCasalDaRevisao(revisao);
        const mensagem = String(revisao.mensagem_recebida || "").trim();

        card.innerHTML = `
          <div class="milene-review-card-top">
            <div class="milene-review-name">${nome}</div>
            <div class="milene-review-action">${acaoVisualRevisao(revisao.acao_sugerida)}</div>
          </div>
          <div class="milene-review-message">${mensagem || "Resposta aguardando revisão."}</div>
        `;
        list.appendChild(card);

        if (revisao.revisao_id) {
          const chave = "margo_home_revisao_som_" + revisao.revisao_id;
          if (!sessionStorage.getItem(chave)) {
            sessionStorage.setItem(chave, "1");
            tocarSomRevisaoHome(revisao.prioridade);
          }
        }
      });
    }

    async function carregarRevisoesMileneHome() {
      try {
        const resposta = await fetch(
          API_REVISOES_PENDENTES + "?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!resposta.ok) return;

        const retorno = await resposta.json();
        renderizarRevisoesMileneHome(retorno.revisoes || []);
      } catch (erro) {
        console.debug("Fila assistida ainda indisponível:", erro);
      }
    }

    function iniciarAtualizacaoRevisoesHome() {
      if (timerRevisoesMileneHome) clearInterval(timerRevisoesMileneHome);
      timerRevisoesMileneHome = setInterval(() => {
        if (document.visibilityState !== "visible") return;
        carregarRevisoesMileneHome();
      }, 30000);
    }

    function lerSessao() {
      try {
        return JSON.parse(localStorage.getItem("margo_usuario") || "null");
      } catch (erro) {
        return null;
      }
    }

    function periodoDia() {
      const hora = new Date().getHours();
      if (hora >= 12 && hora < 18) return "Boa tarde";
      if (hora >= 18 || hora < 5) return "Boa noite";
      return "Bom dia";
    }

    function nomeUsuarioSessao() {
      const sessao = lerSessao();
      return String((sessao && sessao.nome_usuario) || "").trim();
    }

    function iniciaisUsuario(usuario) {
      const nome = limpar((usuario && (usuario.nome_usuario || usuario.nome)) || "");

      if (!nome) return "?";

      const partes = nome.split(/\s+/).filter(Boolean);
      const primeira = partes[0] ? partes[0].charAt(0) : "";
      const segunda = partes.length > 1 ? partes[partes.length - 1].charAt(0) : "";

      return (primeira + segunda).toUpperCase() || "?";
    }

    function aplicarFotoUsuarioTopo(usuario) {
      const container = document.getElementById("fotoUsuarioTopo");
      if (!container) return;

      const fotoUrl = limpar(usuario && usuario.foto_url);
      const iniciais = iniciaisUsuario(usuario);

      container.innerHTML = "";

      if (!fotoUrl) {
        container.textContent = iniciais;
        return;
      }

      const imagem = document.createElement("img");
      imagem.src = fotoUrl;
      imagem.alt = "Foto do usuário";
      imagem.onerror = function () {
        container.innerHTML = "";
        container.textContent = iniciais;
      };

      container.appendChild(imagem);
    }

    function abrirMenu() {
      irParaMenuPrincipal();
    }


    document.addEventListener("click", function(event) {
      const menu = document.getElementById("menuOpcoes");
      const botao = document.querySelector(".menu-icon");
      if (!menu || menu.classList.contains("hidden")) return;
      if (menu.contains(event.target) || botao.contains(event.target)) return;
      fecharMenuOpcoes();
    });

    function extrairListaUsuarios(dados) {
      if (Array.isArray(dados)) return dados;
      if (dados && Array.isArray(dados.usuarios)) return dados.usuarios;
      if (dados && Array.isArray(dados.data)) return dados.data;
      if (dados && dados.usuario_id) return [dados];
      return [];
    }

    function extrairListaCasais(dados) {
      if (Array.isArray(dados)) return dados;
      if (dados && Array.isArray(dados.casais)) return dados.casais;
      if (dados && Array.isArray(dados.data)) return dados.data;
      if (dados && Array.isArray(dados.items)) return dados.items;
      if (dados && dados.casal_id) return [dados];
      return [];
    }

    async function fetchJsonComTimeout(url, timeoutMs = 9000) {
      const controlador = new AbortController();
      const timer = setTimeout(() => controlador.abort(), timeoutMs);

      try {
        const resposta = await fetch(url, {
          cache: "no-store",
          signal: controlador.signal
        });

        if (!resposta.ok) {
          throw new Error("HTTP " + resposta.status + " ao buscar " + url);
        }

        return await resposta.json();
      } finally {
        clearTimeout(timer);
      }
    }

    function campoPreenchido(valor) {
      return limpar(valor) !== "";
    }

    function combinarUsuarios(base, extra) {
      const combinado = Object.assign({}, base || {});

      Object.keys(extra || {}).forEach(chave => {
        if (!campoPreenchido(combinado[chave]) && campoPreenchido(extra[chave])) {
          combinado[chave] = extra[chave];
        }
      });

      return combinado;
    }

    async function buscarUsuarioLista() {
      const urls = [API_USUARIOS, API_USUARIOS_ALTERNATIVO].filter(Boolean);

      for (const url of urls) {
        try {
          const dados = await fetchJsonComTimeout(url + "?t=" + Date.now(), 7000);
          const usuarios = extrairListaUsuarios(dados);
          const encontrado = usuarios.find(usuario => {
            return String(usuario.usuario_id || "").trim() === String(usuarioAtualId).trim();
          }) || null;

          if (encontrado) return encontrado;
        } catch (erro) {
          console.warn("Erro ao buscar usuário na lista:", url, erro);
        }
      }

      return null;
    }

    async function buscarUsuarioValidado() {
      try {
        const sessao = lerSessao();
        const senhaAcesso = limpar(sessao && sessao.senha_acesso);
        if (!usuarioAtualId || !senhaAcesso) return null;

        const resposta = await fetch(API_VALIDAR_USUARIO, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usuario_id: usuarioAtualId,
            senha_acesso: senhaAcesso
          })
        });

        const dados = await resposta.json();
        if (!dados || dados.autorizado !== true) return null;
        return dados;
      } catch (erro) {
        console.warn("Erro ao validar usuário para carregar foto:", erro);
        return null;
      }
    }

    async function carregarUsuario() {
      const sessao = lerSessao();
      const nomeSessao = limpar(sessao && sessao.nome_usuario);

      if (sessao) {
        aplicarFotoUsuarioTopo(sessao);
      }

      if (!usuarioAtualId) {
        document.getElementById("saudacao").textContent = periodoDia() + " ☀️";
        return;
      }

      try {
        const usuarioLista = await buscarUsuarioLista();
        const usuarioValidado = await buscarUsuarioValidado();
        usuarioAtual = combinarUsuarios(combinarUsuarios(sessao, usuarioLista), usuarioValidado);

        if (usuarioAtual) {
          aplicarFotoUsuarioTopo(usuarioAtual);
        }

        const nome = limpar((usuarioAtual && (usuarioAtual.nome_usuario || usuarioAtual.nome)) || nomeSessao);

        if (nome) {
          document.getElementById("saudacao").textContent = periodoDia() + ", " + nome + " ☀️";
        } else {
          document.getElementById("saudacao").textContent = periodoDia() + " ☀️";
        }

      } catch (erro) {
        console.error("Erro ao carregar usuário:", erro);

        if (nomeSessao) {
          document.getElementById("saudacao").textContent = periodoDia() + ", " + nomeSessao + " ☀️";
        } else {
          document.getElementById("saudacao").textContent = periodoDia() + " ☀️";
        }
      }
    }

    async function carregarCasais() {
      const lista = document.getElementById("listaCasais");
      const totalNovos = document.getElementById("totalNovos");
      const totalOportunidadesEl = document.getElementById("totalOportunidades");

      try {
        const dadosCasais = await fetchJsonComTimeout(API_CASAIS + "?t=" + Date.now(), 9000);
        const casais = extrairListaCasais(dadosCasais);
        const casaisNovos = filtrarCasaisDaCHO(casais);

        let totalOportunidades = 0;
        try {
          const dadosOportunidades = await fetchJsonComTimeout(API_OPORTUNIDADES + "?t=" + Date.now(), 7000);
          totalOportunidades = contarOportunidadesDaCHO(dadosOportunidades);
        } catch (erroOportunidades) {
          console.warn("Não foi possível carregar oportunidades. Novos casais serão exibidos mesmo assim.", erroOportunidades);
        }

        console.log("Home CHO", {
          usuarioAtualId,
          totalCasaisRecebidos: casais.length,
          totalNovosDaCHO: casaisNovos.length,
          casaisNovos
        });

        renderizarCasais(casaisNovos, totalOportunidades);

      } catch (erro) {
        console.error("Erro ao carregar casais:", erro);

        lista.innerHTML =
          '<div class="empty">Não foi possível carregar os casais agora.<br>Atualize a página ou confira o endpoint /crm/casais.</div>';

        totalNovos.textContent = "0";
        totalOportunidadesEl.textContent = "0";
      }
    }

    async function iniciarHome() {
      await carregarUsuario();
      await carregarCasais();
      await carregarRevisoesMileneHome();
      iniciarAtualizacaoRevisoesHome();

      setTimeout(carregarCasais, 900);
      setTimeout(carregarCasais, 1800);
      setTimeout(carregarRevisoesMileneHome, 1200);
    }

    window.addEventListener("pageshow", function () {
      if (garantirSessaoObrigatoria()) {
        carregarCasais();
        carregarRevisoesMileneHome();
      }
    });

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && garantirSessaoObrigatoria()) {
        carregarCasais();
      }
    });

    if (garantirSessaoObrigatoria()) {
      iniciarHome();
    }
  </script>
</body>
